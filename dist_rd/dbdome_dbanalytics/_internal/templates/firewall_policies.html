<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firewall Policies - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);display:flex;align-items:center;gap:8px;}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .toolbar{background:var(--bg-primary);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .toolbar select,.toolbar input{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .toolbar select:focus,.toolbar input:focus{border-color:var(--blue);outline:none;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;} .btn-primary:hover{filter:brightness(1.15);}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .btn-edit{color:var(--blue);border-color:var(--blue);}
  .btn-delete{color:var(--red-text);border-color:var(--red-text);}
  .btn-toggle-on{color:var(--green-text);border-color:var(--green-text);}
  .btn-toggle-off{color:var(--yellow);border-color:var(--yellow);}
  .preset-bar{background:var(--bg-primary);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .preset-label{font-size:12px;color:var(--text-secondary);margin-right:4px;}
  .btn-pci{background:#1a3a5c;color:#5ba3e0;border:1px solid #2a5080;cursor:pointer;padding:4px 12px;border-radius:3px;font-size:12px;}
  .btn-pci:hover{background:#1f4d7a;}
  .btn-hipaa{background:#1a3a1a;color:#6ccf8e;border:1px solid #2a6b3a;cursor:pointer;padding:4px 12px;border-radius:3px;font-size:12px;}
  .btn-hipaa:hover{background:#224a22;}
  .btn-gdpr{background:#3a2a1a;color:#eb7b18;border:1px solid #6b4a1a;cursor:pointer;padding:4px 12px;border-radius:3px;font-size:12px;}
  .btn-gdpr:hover{background:#4a3a1a;}
  .btn-soc2{background:#2a1a3a;color:#9933cc;border:1px solid #5a2a7a;cursor:pointer;padding:4px 12px;border-radius:3px;font-size:12px;}
  .btn-soc2:hover{background:#3a1a5a;}
  .stats-row{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:120px;text-align:center;}
  .stat-value{font-size:26px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .content-row{display:flex;gap:8px;padding:0 16px;margin-top:8px;align-items:flex-start;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:16px;overflow-x:auto;}
  .form-panel{width:320px;flex-shrink:0;}
  .table-panel{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);outline:none;}
  .form-group textarea{min-height:54px;resize:vertical;font-family:monospace;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-block{background:#3a0a1a;color:var(--red-text);}
  .badge-alert{background:#3a2a00;color:var(--yellow);}
  .badge-allow{background:#0a1f0a;color:var(--green-text);}
  .badge-mask{background:#1a0a3a;color:var(--purple);}
  .badge-active{background:#0a1f0a;color:var(--green-text);}
  .badge-inactive{background:#2a2a2a;color:var(--text-secondary);}
  .badge-pci{background:#0a1f3a;color:#5ba3e0;}
  .badge-hipaa{background:#0a1f0a;color:var(--green-text);}
  .badge-gdpr{background:#2a1a00;color:var(--orange);}
  .badge-soc2{background:#1a0a2a;color:var(--purple);}
  .actions-cell{display:flex;gap:4px;white-space:nowrap;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .filter-group{display:flex;flex-direction:column;}
  .cvalue{max-width:180px;font-family:monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Firewall Policies</div>
</div>

<div class="preset-bar">
  <span class="preset-label">Apply template:</span>
  <button class="btn-pci" onclick="applyTemplate('PCI-DSS')">PCI-DSS</button>
  <button class="btn-hipaa" onclick="applyTemplate('HIPAA')">HIPAA</button>
  <button class="btn-gdpr" onclick="applyTemplate('GDPR')">GDPR</button>
  <button class="btn-soc2" onclick="applyTemplate('SOC2')">SOC2</button>
</div>

<div class="toolbar">
  <div class="filter-group">
    <label>Action</label>
    <select id="filter-action" onchange="loadPolicies()">
      <option value="">All</option>
      <option>BLOCK</option><option>ALERT</option><option>ALLOW</option><option>MASK</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Regulation</label>
    <select id="filter-reg" onchange="loadPolicies()">
      <option value="">All</option>
      <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Status</label>
    <select id="filter-active" onchange="loadPolicies()">
      <option value="">All</option>
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>
  </div>
  <button class="btn btn-primary" style="margin-top:18px" onclick="newPolicy()">+ Add Policy</button>
</div>

<div class="stats-row" id="stats-row"></div>

<div class="content-row">
  <div class="panel form-panel">
    <div class="panel-header">
      <span id="form-title">New Policy</span>
      <button class="btn btn-sm" onclick="cancelForm()">Cancel</button>
    </div>
    <div class="panel-body">
      <input type="hidden" id="f-policy-id" value="">
      <div class="form-group">
        <label>Policy Name *</label>
        <input id="f-name" placeholder="PCI-DSS: Block card export">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Action *</label>
          <select id="f-action">
            <option>BLOCK</option><option selected>ALERT</option><option>ALLOW</option><option>MASK</option>
          </select>
        </div>
        <div class="form-group">
          <label>Severity</label>
          <select id="f-severity">
            <option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Regulation</label>
          <select id="f-regulation">
            <option value="">None</option>
            <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option><option>internal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vendor</label>
          <select id="f-vendor">
            <option selected value="all">all</option>
            <option>mssql</option><option>postgres</option><option>mysql</option>
            <option>oracle</option><option>mariadb</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Condition Type *</label>
        <select id="f-ctype">
          <option value="query_pattern">query_pattern — regex on SQL text</option>
          <option value="user">user — match login name</option>
          <option value="role">role — match database role</option>
          <option value="ip">ip — match client IP / CIDR</option>
          <option value="table_name">table_name — match table (regex)</option>
          <option value="schema_name">schema_name — match schema (regex)</option>
          <option value="time_range">time_range — HH:MM-HH:MM window</option>
        </select>
      </div>
      <div class="form-group">
        <label>Condition Value *</label>
        <textarea id="f-cvalue" placeholder="Regex or value for the condition type above"></textarea>
      </div>
      <div class="form-group">
        <label>Priority (lower = evaluated first)</label>
        <input type="number" id="f-priority" value="100" min="1" max="9999">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="savePolicy()">Save Policy</button>
    </div>
  </div>

  <div class="panel table-panel">
    <div class="panel-header">
      <span>Policies</span>
      <span id="policy-count" style="font-size:12px;color:var(--text-secondary)"></span>
    </div>
    <div class="panel-body" style="padding:0">
      <table>
        <thead>
          <tr>
            <th>Pri</th>
            <th>Policy Name</th>
            <th>Vendor</th>
            <th>Action</th>
            <th>Condition</th>
            <th>Value</th>
            <th>Regulation</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="policy-table-body">
          <tr><td colspan="9" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let policies = [];

function actionBadge(a){
  const m={BLOCK:'badge-block',ALERT:'badge-alert',ALLOW:'badge-allow',MASK:'badge-mask'};
  return `<span class="badge ${m[a]||''}">${a}</span>`;
}
function regBadge(r){
  if(!r) return '';
  const m={'PCI-DSS':'badge-pci','HIPAA':'badge-hipaa','GDPR':'badge-gdpr','SOC2':'badge-soc2'};
  return `<span class="badge ${m[r]||''}">${r}</span>`;
}

async function loadPolicies(){
  const action = document.getElementById('filter-action').value;
  const reg    = document.getElementById('filter-reg').value;
  const active = document.getElementById('filter-active').value;
  const params = new URLSearchParams();
  if(action) params.set('action', action);
  if(reg)    params.set('regulation', reg);
  if(active !== '') params.set('is_active', active);
  const res  = await fetch('/api/firewall-policies?' + params);
  const data = await res.json();
  policies   = data.policies || [];

  const counts = {BLOCK:0, ALERT:0, ALLOW:0, MASK:0, active:0};
  policies.forEach(p => { if(counts[p.action]!==undefined) counts[p.action]++; if(p.is_active) counts.active++; });
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${counts.BLOCK}</div><div class="stat-label">BLOCK</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${counts.ALERT}</div><div class="stat-label">ALERT</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${counts.ALLOW}</div><div class="stat-label">ALLOW</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--purple)">${counts.MASK}</div><div class="stat-label">MASK</div></div>
    <div class="stat-panel"><div class="stat-value">${counts.active}</div><div class="stat-label">Active</div></div>
  `;
  document.getElementById('policy-count').textContent = `${policies.length} policies`;

  const tbody = document.getElementById('policy-table-body');
  if(!policies.length){
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No policies found</td></tr>';
    return;
  }
  tbody.innerHTML = policies.map(p => `
    <tr>
      <td>${p.priority}</td>
      <td style="font-weight:500;font-size:12px">${p.policy_name}</td>
      <td style="font-size:11px;color:var(--text-secondary)">${p.vendor||'all'}</td>
      <td>${actionBadge(p.action)}</td>
      <td style="font-size:11px;color:var(--blue)">${p.condition_type||''}</td>
      <td class="cvalue" title="${(p.condition_value||'').replace(/"/g,'&quot;')}">${p.condition_value||''}</td>
      <td>${regBadge(p.regulation)}</td>
      <td>${p.is_active?'<span class="badge badge-active">Active</span>':'<span class="badge badge-inactive">Inactive</span>'}</td>
      <td>
        <div class="actions-cell">
          <button class="btn btn-sm btn-edit" onclick="editPolicy(${p.policy_id})">Edit</button>
          <button class="btn btn-sm ${p.is_active?'btn-toggle-off':'btn-toggle-on'}" onclick="togglePolicy(${p.policy_id},${!p.is_active})">${p.is_active?'Disable':'Enable'}</button>
          <button class="btn btn-sm btn-delete" onclick="deletePolicy(${p.policy_id},'${p.policy_name.replace(/'/g,"\\'")}')">Del</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function newPolicy(){
  document.getElementById('form-title').textContent = 'New Policy';
  document.getElementById('f-policy-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-action').value = 'ALERT';
  document.getElementById('f-severity').value = 'MEDIUM';
  document.getElementById('f-regulation').value = '';
  document.getElementById('f-vendor').value = 'all';
  document.getElementById('f-ctype').value = 'query_pattern';
  document.getElementById('f-cvalue').value = '';
  document.getElementById('f-priority').value = '100';
}

function editPolicy(id){
  const p = policies.find(x=>x.policy_id===id);
  if(!p) return;
  document.getElementById('form-title').textContent = 'Edit Policy';
  document.getElementById('f-policy-id').value = id;
  document.getElementById('f-name').value = p.policy_name||'';
  document.getElementById('f-action').value = p.action||'ALERT';
  document.getElementById('f-severity').value = p.severity||'MEDIUM';
  document.getElementById('f-regulation').value = p.regulation||'';
  document.getElementById('f-vendor').value = p.vendor||'all';
  document.getElementById('f-ctype').value = p.condition_type||'query_pattern';
  document.getElementById('f-cvalue').value = p.condition_value||'';
  document.getElementById('f-priority').value = p.priority||100;
}

function cancelForm(){ newPolicy(); }

async function savePolicy(){
  const id = document.getElementById('f-policy-id').value;
  const body = {
    policy_name:     document.getElementById('f-name').value.trim(),
    action:          document.getElementById('f-action').value,
    severity:        document.getElementById('f-severity').value,
    regulation:      document.getElementById('f-regulation').value || null,
    vendor:          document.getElementById('f-vendor').value,
    condition_type:  document.getElementById('f-ctype').value,
    condition_value: document.getElementById('f-cvalue').value.trim(),
    priority:        parseInt(document.getElementById('f-priority').value)||100,
  };
  if(!body.policy_name){ showToast('Policy name is required', true); return; }
  if(!body.condition_value){ showToast('Condition value is required', true); return; }
  const url    = id ? `/api/firewall-policies/${id}` : '/api/firewall-policies';
  const method = id ? 'PUT' : 'POST';
  const res    = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data   = await res.json();
  if(!res.ok){ showToast(data.detail||data.message||'Error', true); return; }
  showToast(id ? 'Policy updated' : 'Policy created');
  newPolicy();
  loadPolicies();
}

async function togglePolicy(id, active){
  const res  = await fetch(`/api/firewall-policies/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({is_active: active}),
  });
  const data = await res.json();
  if(!res.ok){ showToast(data.detail||'Error', true); return; }
  showToast(active ? 'Policy enabled' : 'Policy disabled');
  loadPolicies();
}

async function deletePolicy(id, name){
  if(!confirm(`Delete policy "${name}"?`)) return;
  const res  = await fetch(`/api/firewall-policies/${id}`, {method:'DELETE'});
  const data = await res.json();
  if(!res.ok){ showToast(data.detail||'Error', true); return; }
  showToast('Policy deleted');
  loadPolicies();
}

async function applyTemplate(regulation){
  if(!confirm(`Add default ${regulation} seed policies (skips duplicates)?`)) return;
  const res  = await fetch('/api/firewall-policies/apply-template', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({regulation}),
  });
  const data = await res.json();
  if(!res.ok){ showToast(data.detail||'Error', true); return; }
  showToast(`${regulation} template: ${data.added} policies added`);
  loadPolicies();
}

function showToast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err?' err':'');
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3500);
}

loadPolicies();
</script>
</body>
</html>
