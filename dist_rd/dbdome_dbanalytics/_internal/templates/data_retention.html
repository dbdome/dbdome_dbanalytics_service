<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Retention - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  .form-panel-body{padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-ok{background:#0a1f0a;color:var(--green-text);}
  .badge-fail{background:#3a0010;color:var(--red-text);}
  .badge-active{background:#0a1f0a;color:var(--green-text);}
  .badge-inactive{background:#2a2a2a;color:var(--text-secondary);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .layout-2col{display:flex;gap:12px;align-items:flex-start;}
  .col-form{width:380px;flex-shrink:0;}
  .col-table{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  .form-hint{font-size:11px;color:var(--text-secondary);margin-top:3px;}
  .text-mono{font-family:monospace;font-size:11px;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Data Retention</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('policies')">Retention Policies</div>
  <div class="tab" onclick="switchTab('executions')">Execution History</div>
</div>

<div class="tab-content active" id="tab-policies">
  <div class="layout-2col">
    <div class="col-form">
      <div class="panel">
        <div class="panel-header"><span id="pol-form-title">New Policy</span>
          <button class="btn-sm" onclick="resetForm()">Reset</button></div>
        <div class="form-panel-body">
          <input type="hidden" id="pf-id">
          <div class="form-group"><label>Policy Name *</label><input id="pf-name"></div>
          <div class="form-row">
            <div class="form-group"><label>Schema *</label><input id="pf-schema" placeholder="log"></div>
            <div class="form-group"><label>Table *</label><input id="pf-table" placeholder="firewall_audit_log"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Retention Days *</label>
              <input type="number" id="pf-days" min="1" placeholder="365"></div>
            <div class="form-group"><label>Min Retain Days</label>
              <input type="number" id="pf-min" min="0" value="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Timestamp Column</label>
              <input id="pf-tscol" value="event_time"></div>
            <div class="form-group"><label>Purge Mode</label>
              <select id="pf-mode"><option>DELETE</option><option>ARCHIVE</option></select></div>
          </div>
          <div class="form-group"><label>Regulation</label>
            <select id="pf-reg">
              <option value="">None</option><option>PCI-DSS</option><option>HIPAA</option>
              <option>GDPR</option><option>SOC2</option>
            </select></div>
          <button class="btn btn-primary" onclick="savePolicy()" style="width:100%">Save Policy</button>
        </div>
      </div>
    </div>
    <div class="col-table">
      <div class="stats-row" id="ret-stats"></div>
      <div class="panel">
        <div class="panel-header"><span>Retention Policies</span>
          <button class="btn-sm" onclick="loadPolicies()">Refresh</button></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Policy Name</th><th>Table</th><th>Retention</th><th>Min Retain</th><th>Regulation</th><th>Last Run</th><th>Active</th><th>Edit</th></tr></thead>
            <tbody id="policies-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-executions">
  <div class="panel">
    <div class="panel-header"><span>Execution History (last 200)</span>
      <button class="btn-sm" onclick="loadExecutions()">Refresh</button></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Executed</th><th>Policy</th><th>Table</th><th>Cutoff Date</th>
          <th>Rows Deleted</th><th>Mode</th><th>Result</th><th>SHA-256</th>
        </tr></thead>
        <tbody id="executions-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let policies=[];
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['policies','executions'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='policies') loadPolicies();
  if(name==='executions') loadExecutions();
}
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',3500);
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,19); }

async function loadPolicies(){
  const res=await fetch('/api/retention/policies');
  const data=await res.json();
  policies=data.policies||[];
  const active=policies.filter(p=>p.is_active).length;
  document.getElementById('ret-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value">${policies.length}</div><div class="stat-label">Total Policies</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${active}</div><div class="stat-label">Active</div></div>
  `;
  document.getElementById('policies-body').innerHTML=policies.length?policies.map(p=>`<tr>
    <td style="font-weight:500;font-size:12px">${p.policy_name||''}</td>
    <td class="text-mono">${p.target_schema||''}.${p.target_table||''}</td>
    <td style="text-align:center">${p.retention_days}d</td>
    <td style="text-align:center;color:var(--text-secondary)">${p.min_retain_days}d</td>
    <td style="font-size:11px">${p.regulation||''}</td>
    <td style="font-size:11px">${fmtTs(p.last_run_at)||'Never'}</td>
    <td>${p.is_active?'<span class="badge badge-active">Yes</span>':'<span class="badge badge-inactive">No</span>'}</td>
    <td><button class="btn btn-sm" onclick="editPolicy(${p.retention_id})">Edit</button></td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No policies defined</td></tr>';
}

function resetForm(){
  document.getElementById('pol-form-title').textContent='New Policy';
  document.getElementById('pf-id').value='';
  ['pf-name','pf-schema','pf-table','pf-days','pf-min'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pf-tscol').value='event_time';
  document.getElementById('pf-mode').value='DELETE';
  document.getElementById('pf-reg').value='';
}

function editPolicy(id){
  const p=policies.find(x=>x.retention_id===id); if(!p) return;
  document.getElementById('pol-form-title').textContent='Edit Policy';
  document.getElementById('pf-id').value=id;
  document.getElementById('pf-name').value=p.policy_name||'';
  document.getElementById('pf-schema').value=p.target_schema||'';
  document.getElementById('pf-table').value=p.target_table||'';
  document.getElementById('pf-days').value=p.retention_days||'';
  document.getElementById('pf-min').value=p.min_retain_days||0;
  document.getElementById('pf-tscol').value=p.timestamp_column||'event_time';
  document.getElementById('pf-mode').value=p.purge_mode||'DELETE';
  document.getElementById('pf-reg').value=p.regulation||'';
}

async function savePolicy(){
  const id=document.getElementById('pf-id').value;
  const body={
    policy_name:document.getElementById('pf-name').value.trim(),
    target_schema:document.getElementById('pf-schema').value.trim(),
    target_table:document.getElementById('pf-table').value.trim(),
    retention_days:parseInt(document.getElementById('pf-days').value),
    min_retain_days:parseInt(document.getElementById('pf-min').value)||0,
    timestamp_column:document.getElementById('pf-tscol').value.trim()||'event_time',
    purge_mode:document.getElementById('pf-mode').value,
    regulation:document.getElementById('pf-reg').value||null,
  };
  if(!body.policy_name||!body.target_table||!body.retention_days){showToast('Name, table, and days required',true);return;}
  const url=id?`/api/retention/policies/${id}`:'/api/retention/policies';
  const res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast(id?'Policy updated':'Policy created'); resetForm(); loadPolicies();
}

async function loadExecutions(){
  const res=await fetch('/api/retention/executions');
  const data=await res.json();
  const rows=data.rows||[];
  document.getElementById('executions-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-size:11px;white-space:nowrap">${fmtTs(r.executed_at)}</td>
    <td style="font-size:11px">${r.policy_name||''}</td>
    <td class="text-mono">${r.target_table||''}</td>
    <td style="font-size:11px">${r.cutoff_date||''}</td>
    <td style="text-align:center;font-weight:500">${r.rows_deleted||0}</td>
    <td style="font-size:11px">${r.purge_mode||''}</td>
    <td><span class="badge badge-${r.success?'ok':'fail'}">${r.success?'OK':'FAIL'}</span></td>
    <td class="text-mono" style="font-size:10px;color:var(--text-secondary);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.sha256_manifest||''}">${(r.sha256_manifest||'').substring(0,16)}…</td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No execution history</td></tr>';
}

loadPolicies();
</script>
</body>
</html>
