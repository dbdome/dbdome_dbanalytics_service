<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Access Review - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  .form-panel-body{padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-open{background:#3a0010;color:var(--red-text);}
  .badge-in-progress{background:#2a1a00;color:var(--yellow);}
  .badge-complete{background:#0a1f0a;color:var(--green-text);}
  .badge-overdue{background:#3a0010;color:var(--red-text);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .layout-2col{display:flex;gap:12px;align-items:flex-start;}
  .col-form{width:360px;flex-shrink:0;}
  .col-table{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Access Review</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('instances')">Review Instances</div>
  <div class="tab" onclick="switchTab('cycles')">Review Cycles</div>
</div>

<div class="tab-content active" id="tab-instances">
  <div class="stats-row" id="review-stats"></div>
  <div class="panel">
    <div class="panel-header"><span>Open Review Instances</span>
      <button class="btn-sm" onclick="loadInstances()">Refresh</button></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Instance</th><th>Cycle</th><th>Regulation</th><th>Period</th>
          <th>Reviewer</th><th>Status</th><th>Due</th>
        </tr></thead>
        <tbody id="instances-body"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-cycles">
  <div class="layout-2col">
    <div class="col-form">
      <div class="panel">
        <div class="panel-header">New Review Cycle</div>
        <div class="form-panel-body">
          <div class="form-group"><label>Cycle Name *</label><input id="cy-name"></div>
          <div class="form-group"><label>Reviewer Email *</label><input id="cy-email" type="email"></div>
          <div class="form-row">
            <div class="form-group"><label>Frequency</label>
              <select id="cy-freq">
                <option>MONTHLY</option><option selected>QUARTERLY</option>
                <option>SEMI_ANNUAL</option><option>ANNUAL</option>
              </select></div>
            <div class="form-group"><label>Regulation</label>
              <select id="cy-reg">
                <option value="">None</option><option>PCI-DSS</option><option>HIPAA</option>
                <option>GDPR</option><option>SOC2</option>
              </select></div>
          </div>
          <div class="form-group"><label>First Due Date</label>
            <input type="date" id="cy-due"></div>
          <button class="btn btn-primary" onclick="saveCycle()" style="width:100%">Create Cycle</button>
        </div>
      </div>
    </div>
    <div class="col-table">
      <div class="panel">
        <div class="panel-header"><span>Review Cycles</span>
          <button class="btn-sm" onclick="loadCycles()">Refresh</button></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Name</th><th>Frequency</th><th>Reviewer</th><th>Regulation</th><th>Next Due</th><th>Active</th></tr></thead>
            <tbody id="cycles-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['instances','cycles'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='instances') loadInstances();
  if(name==='cycles') loadCycles();
}
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',3500);
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,10); }

async function loadInstances(){
  const res=await fetch('/api/access-review/instances');
  const data=await res.json();
  const rows=data.rows||[];
  const open=rows.filter(r=>r.status==='OPEN').length;
  const overdue=rows.filter(r=>r.status==='OPEN'&&r.period_end&&new Date(r.period_end)<new Date()).length;
  document.getElementById('review-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${open}</div><div class="stat-label">Open</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${overdue}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-panel"><div class="stat-value">${rows.length}</div><div class="stat-label">Total</div></div>
  `;
  document.getElementById('instances-body').innerHTML=rows.length?rows.map(r=>{
    const isOverdue=r.status==='OPEN'&&r.period_end&&new Date(r.period_end)<new Date();
    const statusBadge=isOverdue?'<span class="badge badge-overdue">OVERDUE</span>':`<span class="badge badge-${(r.status||'').toLowerCase().replace('_','-')}">${r.status||''}</span>`;
    return `<tr>
      <td style="font-size:11px">#${r.instance_id}</td>
      <td style="font-size:11px">${r.cycle_name||''}</td>
      <td style="font-size:11px">${r.regulation||''}</td>
      <td style="font-size:11px;white-space:nowrap">${fmtTs(r.period_start)} – ${fmtTs(r.period_end)}</td>
      <td style="font-size:11px">${r.reviewer_email||''}</td>
      <td>${statusBadge}</td>
      <td style="font-size:11px;${isOverdue?'color:var(--red-text)':''}">${fmtTs(r.period_end)}</td>
    </tr>`;}).join(''):'<tr><td colspan="7" class="empty">No review instances</td></tr>';
}

async function loadCycles(){
  const res=await fetch('/api/access-review/cycles');
  const data=await res.json();
  const rows=data.rows||[];
  document.getElementById('cycles-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-weight:500">${r.cycle_name||''}</td>
    <td style="font-size:11px">${r.frequency||''}</td>
    <td style="font-size:11px">${r.reviewer_email||''}</td>
    <td style="font-size:11px">${r.regulation||''}</td>
    <td style="font-size:11px">${fmtTs(r.next_cycle_due_at)}</td>
    <td>${r.is_active?'<span style="color:var(--green-text)">●</span>':'<span style="color:var(--text-secondary)">●</span>'}</td>
  </tr>`).join(''):'<tr><td colspan="6" class="empty">No review cycles</td></tr>';
}

async function saveCycle(){
  const body={
    cycle_name:document.getElementById('cy-name').value.trim(),
    reviewer_email:document.getElementById('cy-email').value.trim(),
    frequency:document.getElementById('cy-freq').value,
    regulation:document.getElementById('cy-reg').value||null,
    next_cycle_due_at:document.getElementById('cy-due').value||null,
  };
  if(!body.cycle_name||!body.reviewer_email){showToast('Name and email required',true);return;}
  const res=await fetch('/api/access-review/cycles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast('Cycle created');
  ['cy-name','cy-email','cy-due'].forEach(id=>document.getElementById(id).value='');
  loadCycles();
}

loadInstances();
</script>
</body>
</html>
