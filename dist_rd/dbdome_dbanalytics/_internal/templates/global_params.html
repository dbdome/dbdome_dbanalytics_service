<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Parameters - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }

  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn-enable { color: var(--green-text); border-color: var(--green-text); }
  .btn-disable { color: var(--red-text); border-color: var(--red-text); }
  .btn-add { background: var(--orange); color: #fff; }
  .btn-add:hover { filter: brightness(1.15); }

  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; margin: 8px 16px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 0; overflow-x: auto; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 10px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }

  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--green-text);
    border-radius: 4px; padding: 12px 20px; color: var(--green-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.error { border-color: var(--red-text); color: var(--red-text); }

  .search-input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 4px; font-size: 12px; width: 200px;
  }

  .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  .table-scroll { max-height: 65vh; overflow-y: auto; }

  .add-form {
    display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .add-form div { display: flex; flex-direction: column; }
  .add-form label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
  .add-form input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .add-form input:focus { border-color: var(--blue); outline: none; }

  .edit-input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--blue); padding: 4px 8px;
    border-radius: 3px; font-size: 12px; font-family: inherit; width: 100%;
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" style="height:28px" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Global Parameters</div>
</nav>

<div class="toolbar">
  <div>
    <label>Search by key</label>
    <input type="text" id="searchInput" class="search-input" placeholder="key name..." />
  </div>
  <div style="align-self: flex-end;">
    <button class="btn btn-primary" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <span>Global Parameters</span>
  </div>
  <div class="add-form">
    <div>
      <label>Key</label>
      <input type="text" id="newKey" placeholder="parameter key" style="width:220px;" />
    </div>
    <div>
      <label>Value</label>
      <input type="text" id="newValue" placeholder="parameter value" style="width:320px;" />
    </div>
    <button class="btn btn-add" onclick="addParam()">Add</button>
  </div>
  <div class="panel-body">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th style="width:140px;">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="3" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allParams = [];
let editingKey = null;

async function loadData() {
  try {
    const resp = await fetch('/api/global-params');
    const data = await resp.json();
    allParams = data.params || [];
    renderTable();
  } catch (e) {
    console.error('Failed to load:', e);
    showToast('Failed to load parameters', true);
  }
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allParams.filter(p => {
    if (search && !p.key.toLowerCase().includes(search)) return false;
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No parameters found. Add one above.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const isEditing = editingKey === p.key;
    const valueCell = isEditing
      ? `<input class="edit-input" id="editValue" value="${escapeHtml(p.value)}" onkeydown="if(event.key==='Enter') saveParam('${escapeAttr(p.key)}')" />`
      : `<span>${escapeHtml(p.value)}</span>`;
    const actions = isEditing
      ? `<button class="btn-sm btn-enable" onclick="saveParam('${escapeAttr(p.key)}')">Save</button>
         <button class="btn-sm" onclick="cancelEdit()">Cancel</button>`
      : `<button class="btn-sm btn-enable" onclick="startEdit('${escapeAttr(p.key)}')">Edit</button>
         <button class="btn-sm btn-disable" onclick="deleteParam('${escapeAttr(p.key)}')">Delete</button>`;

    return `<tr>
      <td><b>${escapeHtml(p.key)}</b></td>
      <td>${valueCell}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');

  if (editingKey !== null) {
    const el = document.getElementById('editValue');
    if (el) el.focus();
  }
}

function startEdit(key) {
  editingKey = key;
  renderTable();
}

function cancelEdit() {
  editingKey = null;
  renderTable();
}

async function saveParam(key) {
  const input = document.getElementById('editValue');
  if (!input) return;
  const value = input.value;
  try {
    const resp = await fetch('/submit-global-param', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key, value})
    });
    if (!resp.ok) throw new Error('Server error');
    editingKey = null;
    showToast('Parameter saved');
    loadData();
  } catch (e) {
    showToast('Failed to save: ' + e.message, true);
  }
}

async function addParam() {
  const keyEl = document.getElementById('newKey');
  const valEl = document.getElementById('newValue');
  const key = keyEl.value.trim();
  const value = valEl.value.trim();
  if (!key) { showToast('Key is required', true); return; }
  try {
    const resp = await fetch('/submit-global-param', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key, value})
    });
    if (!resp.ok) throw new Error('Server error');
    keyEl.value = '';
    valEl.value = '';
    showToast('Parameter added');
    loadData();
  } catch (e) {
    showToast('Failed to add: ' + e.message, true);
  }
}

async function deleteParam(key) {
  if (!confirm('Delete parameter "' + key + '"?')) return;
  try {
    const resp = await fetch('/api/delete-global-param', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key})
    });
    if (!resp.ok) throw new Error('Server error');
    showToast('Parameter deleted');
    loadData();
  } catch (e) {
    showToast('Failed to delete: ' + e.message, true);
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(str) {
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('searchInput').addEventListener('input', renderTable);

loadData();
</script>
</body>
</html>
