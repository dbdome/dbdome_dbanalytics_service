<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Security Alert Dashboard - dbdome</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  /* Grafana Dark Theme */
  :root {
    --bg-canvas: #111217;
    --bg-primary: #181b1f;
    --bg-secondary: #22252b;
    --border: #343436;
    --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65);
    --text-emphasis: #ffffff;
    --blue: #33a2e5;
    --blue-base: #3d71d9;
    --green: #1a7f4b;
    --green-text: #6ccf8e;
    --red: #d10e5c;
    --red-text: #ff5286;
    --yellow: #ecbb13;
    --purple: #9933cc;
    --orange: #eb7b18;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  /* Grafana-style top nav */
  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand {
    font-size: 18px; font-weight: 500; color: var(--text-emphasis);
    display: flex; align-items: center; gap: 8px;
  }
  .navbar-brand img { height: 28px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }
  .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* Grafana-style controls bar */
  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn-run {
    background: var(--blue-base); color: #fff; border: none;
    padding: 6px 16px; border-radius: 4px; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit;
  }
  .btn-run:hover { filter: brightness(1.15); }

  /* Grafana-style panel */
  .panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; margin: 8px;
  }
  .panel-header {
    padding: 8px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 0; }

  /* Stats row */
  .stats-row { display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; }
  .stat-panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; padding: 16px; flex: 1; min-width: 130px;
    text-align: center;
  }
  .stat-value { font-size: 32px; font-weight: 500; line-height: 1.2; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* Legend */
  .legend-bar {
    display: flex; gap: 16px; padding: 6px 16px; font-size: 12px;
    color: var(--text-secondary); flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* Tree */
  .tree-wrap { overflow: auto; min-height: 500px; }
  .node text { fill: var(--text-primary); font-size: 12px; font-family: Inter, Helvetica, Arial, sans-serif; }
  .link { fill: none; stroke: var(--border); stroke-width: 1.5px; }

  .node--server circle { fill: var(--blue); stroke: var(--blue); r: 8; }
  .node--domain circle { fill: var(--purple); stroke: var(--purple); }
  .node--area circle { fill: var(--green-text); stroke: var(--green-text); }
  .node--issue circle { fill: var(--yellow); stroke: var(--yellow); }
  .node--rootcause circle { fill: var(--red-text); stroke: var(--red-text); }
  .node--rootcause-clear circle { fill: var(--bg-secondary); stroke: #555; }

  /* Tooltip */
  .tooltip {
    position: absolute; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 14px; font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    max-width: 420px; z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .tt-title { font-weight: 600; color: var(--text-emphasis); margin-bottom: 6px; font-size: 13px; }
  .tt-row { margin: 2px 0; }
  .tt-label { color: var(--text-secondary); }
  .sev-critical { color: var(--red-text); font-weight: 600; }
  .sev-high { color: var(--orange); font-weight: 600; }
  .sev-medium { color: var(--yellow); }

  #noData {
    text-align: center; padding: 80px 20px;
    color: var(--text-secondary); font-size: 16px; display: none;
  }
</style>
</head>
<body>

<!-- Grafana-style navbar -->
<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Security Alert Dashboard / SEC Domain</div>
</nav>

<!-- Toolbar -->
<div class="toolbar">
  <div>
    <label>Time range</label>
    <select id="timeRange">
      <option value="1">Last 24 hours</option>
      <option value="3">Last 3 days</option>
      <option value="7" selected>Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
  </div>
  <div>
    <label>Server</label>
    <select id="serverFilter"><option value="all">All</option></select>
  </div>
  <div>
    <label>Severity</label>
    <select id="severityFilter">
      <option value="all">All</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
    </select>
  </div>
  <div>
    <button class="btn-run" onclick="loadData()">Run query</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-row" id="statsBar"></div>

<!-- Tree Panel -->
<div class="panel" style="margin:8px;">
  <div class="panel-header">
    <span>Alert Hierarchy: Server &rarr; Area &rarr; Issue &rarr; Root Cause</span>
    <div class="legend-bar">
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Server</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div>Domain</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green-text)"></div>Area</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Issue</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red-text)"></div>Alert</div>
      <div class="legend-item"><div class="legend-dot" style="background:#555"></div>Clear</div>
    </div>
  </div>
  <div class="panel-body">
    <div id="noData">No alerts found for the selected time range and filters.</div>
    <div class="tree-wrap" id="treeContainer"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const tooltip = d3.select('#tooltip');

async function loadData() {
  const days = document.getElementById('timeRange').value;
  const server = document.getElementById('serverFilter').value;
  const severity = document.getElementById('severityFilter').value;

  let url = `/api/alert_dashboard?days=${days}`;
  if (server !== 'all') url += `&server=${encodeURIComponent(server)}`;
  if (severity !== 'all') url += `&severity=${severity}`;

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    updateStats(data.stats);
    updateServerFilter(data.servers);
    renderTree(data.tree);
  } catch (e) {
    console.error('Load failed:', e);
    document.getElementById('noData').style.display = 'block';
    document.getElementById('noData').textContent = 'Failed to load data: ' + e.message;
  }
}

function updateStats(s) {
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-emphasis)">${s.total_alerts}</div><div class="stat-label">Total Alerts</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${s.critical}</div><div class="stat-label">Critical</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--orange)">${s.high}</div><div class="stat-label">High</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${s.medium}</div><div class="stat-label">Medium</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${s.servers}</div><div class="stat-label">Servers</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--purple)">${s.root_causes}</div><div class="stat-label">Root Causes</div></div>
  `;
}

function updateServerFilter(servers) {
  const sel = document.getElementById('serverFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All</option>' +
    servers.map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
}

function renderTree(treeData) {
  const container = document.getElementById('treeContainer');
  container.innerHTML = '';

  if (!treeData || !treeData.children || treeData.children.length === 0) {
    document.getElementById('noData').style.display = 'block';
    return;
  }
  document.getElementById('noData').style.display = 'none';

  const nodeH = 24;
  const root = d3.hierarchy(treeData);

  // Expand first 3 levels
  root.descendants().forEach(d => {
    if (d.depth > 3) { d._children = d.children; d.children = null; }
  });

  const treeLayout = d3.tree().nodeSize([nodeH, 240]);

  const svg = d3.select(container).append('svg')
    .attr('width', '100%').style('min-height', '500px');

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);
  svg.call(zoom.transform, d3.zoomIdentity.translate(60, 300).scale(0.9));

  function update(source) {
    treeLayout(root);
    const nodes = root.descendants();
    const links = root.links();

    let x0 = Infinity, x1 = -Infinity;
    nodes.forEach(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
    svg.attr('height', Math.max(x1 - x0 + 200, 500));

    const dur = 250;

    // Links
    const link = g.selectAll('.link').data(links, d => d.target.data.id);
    link.enter().append('path').attr('class', 'link')
      .attr('d', () => diag({x: source.x0||0, y: source.y0||0}, {x: source.x0||0, y: source.y0||0}))
      .merge(link).transition().duration(dur)
      .attr('d', d => diag(d.source, d.target));
    link.exit().transition().duration(dur)
      .attr('d', () => diag({x:source.x,y:source.y},{x:source.x,y:source.y})).remove();

    // Nodes
    const node = g.selectAll('.node').data(nodes, d => d.data.id);
    const ne = node.enter().append('g')
      .attr('class', d => `node node--${d.data.type}`)
      .attr('transform', () => `translate(${source.y0||0},${source.x0||0})`)
      .style('cursor', 'pointer')
      .on('click', (ev, d) => {
        if (d.children) { d._children = d.children; d.children = null; }
        else if (d._children) { d.children = d._children; d._children = null; }
        update(d);
      })
      .on('mouseover', (ev, d) => showTip(ev, d.data))
      .on('mouseout', () => tooltip.style('opacity', 0));

    ne.append('circle').attr('r', d => d.data.type==='server'?8:(d.data.type==='rootcause'?7:5));

    ne.append('text').attr('dy', 4)
      .attr('x', d => (d.children||d._children) ? -14 : 14)
      .attr('text-anchor', d => (d.children||d._children) ? 'end' : 'start')
      .text(d => {
        let t = d.data.name;
        if (d.data.alert_count) t += ` [${d.data.alert_count}]`;
        return t.length > 55 ? t.slice(0,52)+'...' : t;
      });

    // Collapse indicator
    ne.filter(d => d._children).append('text')
      .attr('dy', 4).attr('x', 12).attr('fill', 'var(--text-secondary)').attr('font-size','10px')
      .text(d => `+${(d._children||[]).length}`);

    ne.merge(node).transition().duration(dur)
      .attr('transform', d => `translate(${d.y},${d.x})`);
    node.exit().transition().duration(dur)
      .attr('transform', () => `translate(${source.y},${source.x})`).remove();

    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
  }

  function diag(s, d) {
    return `M${s.y},${s.x} C${(s.y+d.y)/2},${s.x} ${(s.y+d.y)/2},${d.x} ${d.y},${d.x}`;
  }

  function showTip(ev, d) {
    let h = `<div class="tt-title">${d.name}</div>`;
    if (d.code) h += `<div class="tt-row"><span class="tt-label">Code:</span> ${d.code}</div>`;
    if (d.type) h += `<div class="tt-row"><span class="tt-label">Type:</span> ${d.type}</div>`;
    if (d.severity) h += `<div class="tt-row"><span class="tt-label">Severity:</span> <span class="sev-${d.severity}">${d.severity.toUpperCase()}</span></div>`;
    if (d.alert_count) h += `<div class="tt-row"><span class="tt-label">Alerts sent:</span> ${d.alert_count}</div>`;
    if (d.last_alert) h += `<div class="tt-row"><span class="tt-label">Last alert:</span> ${d.last_alert}</div>`;
    if (d.description) h += `<div class="tt-row" style="margin-top:6px;color:var(--text-secondary)">${d.description.substring(0,200)}</div>`;
    tooltip.html(h).style('left',(ev.pageX+12)+'px').style('top',(ev.pageY-8)+'px').style('opacity',1);
  }

  update(root);
}

loadData();
</script>
</body>
</html>
