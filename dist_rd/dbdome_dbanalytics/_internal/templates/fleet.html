<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Server Fleet - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  /* navbar */
  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .navbar-brand img { height: 28px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }
  .navbar-right { margin-left: auto; font-size: 12px; color: var(--text-secondary); }

  /* toolbar */
  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .search-input { width: 220px; }

  /* stats row */
  .stats-row { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
  .stat-panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; padding: 16px; flex: 1; min-width: 130px; text-align: center;
  }
  .stat-value { font-size: 32px; font-weight: 500; line-height: 1.2; color: var(--text-emphasis); }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* panel + table */
  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; margin: 8px 16px 16px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 0; overflow-x: auto; }
  .table-scroll { max-height: 70vh; overflow-y: auto; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 12px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-primary); white-space: nowrap; }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }
  .data-table td.mono { font-family: 'Roboto Mono', monospace; color: var(--text-secondary); }

  /* pills / badges */
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill-up { color: var(--green-text); background: rgba(108, 207, 142, 0.12); }
  .pill-down { color: var(--text-secondary); background: rgba(204, 204, 220, 0.08); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
           background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); text-transform: uppercase; }
  .alert-count { font-weight: 600; }
  .alert-zero { color: var(--text-secondary); }
  .alert-some { color: var(--orange); }
  .alert-hot { color: var(--red-text); }

  .empty-state { text-align: center; padding: 48px; color: var(--text-secondary); font-size: 14px; }
  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--red-text);
    border-radius: 4px; padding: 12px 20px; color: var(--red-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Server Fleet</div>
  <div class="navbar-right" id="lastUpdated"></div>
</nav>

<div class="toolbar">
  <div>
    <label>Alert window</label>
    <select id="timeRange">
      <option value="1">Last 24 hours</option>
      <option value="7" selected>Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
    </select>
  </div>
  <div>
    <label>Vendor</label>
    <select id="vendorFilter"><option value="all">All</option></select>
  </div>
  <div>
    <label>Status</label>
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
  <div>
    <label>Search</label>
    <input type="text" id="searchInput" class="search-input" placeholder="server or host..." />
  </div>
  <div>
    <button class="btn btn-primary" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="stats-row" id="statsBar"></div>

<div class="panel">
  <div class="panel-header">
    <span>Monitored Servers</span>
    <span id="serverCount" style="font-size:12px;color:var(--text-secondary);font-weight:400;"></span>
  </div>
  <div class="panel-body">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th>Server</th>
            <th>Vendor</th>
            <th>Host</th>
            <th>Port</th>
            <th>Version</th>
            <th>Status</th>
            <th>Alerts</th>
            <th>Last alert</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allServers = [];

async function loadData() {
  const days = document.getElementById('timeRange').value;
  try {
    const resp = await fetch('/api/fleet?days=' + encodeURIComponent(days));
    const data = await resp.json();
    if (data.error) showToast('Load error: ' + data.error);
    allServers = data.servers || [];
    updateVendorFilter(data.vendors || []);
    renderStats(data.stats || {});
    renderTable();
    const now = new Date();
    document.getElementById('lastUpdated').textContent = 'Updated ' + now.toLocaleTimeString();
  } catch (e) {
    console.error('Load failed:', e);
    showToast('Failed to load fleet: ' + e.message);
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="8" class="empty-state">Failed to load data.</td></tr>';
  }
}

function renderStats(s) {
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-panel"><div class="stat-value">${s.total ?? 0}</div><div class="stat-label">Servers</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${s.active ?? 0}</div><div class="stat-label">Active</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-secondary)">${s.inactive ?? 0}</div><div class="stat-label">Inactive</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${s.vendors ?? 0}</div><div class="stat-label">Vendors</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--orange)">${s.with_alerts ?? 0}</div><div class="stat-label">Servers w/ alerts</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${s.alerts ?? 0}</div><div class="stat-label">Alerts in window</div></div>
  `;
}

function updateVendorFilter(vendors) {
  const sel = document.getElementById('vendorFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All</option>' +
    vendors.map(v => `<option value="${escapeAttr(v)}" ${v === cur ? 'selected' : ''}>${escapeHtml(v)}</option>`).join('');
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const vendor = document.getElementById('vendorFilter').value;
  const status = document.getElementById('statusFilter').value;

  const filtered = allServers.filter(s => {
    if (vendor !== 'all' && (s.db_vendor || '') !== vendor) return false;
    if (status === 'active' && !s.is_active) return false;
    if (status === 'inactive' && s.is_active) return false;
    if (search) {
      const hay = ((s.server || '') + ' ' + (s.ip_address || '')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tableBody');
  document.getElementById('serverCount').textContent =
    filtered.length + ' of ' + allServers.length + ' servers';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No servers match the current filters.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(s => {
    const status = s.is_active
      ? '<span class="pill pill-up">Active</span>'
      : '<span class="pill pill-down">Inactive</span>';
    const n = s.alert_count || 0;
    const cls = n === 0 ? 'alert-zero' : (n >= 10 ? 'alert-hot' : 'alert-some');
    const alerts = `<span class="alert-count ${cls}">${n}</span>`;
    return `<tr>
      <td><b>${escapeHtml(s.server)}</b></td>
      <td><span class="badge">${escapeHtml(s.db_vendor || '—')}</span></td>
      <td class="mono">${escapeHtml(s.ip_address || '—')}</td>
      <td class="mono">${escapeHtml(s.port != null ? String(s.port) : '—')}</td>
      <td>${escapeHtml(s.db_version || '—')}</td>
      <td>${status}</td>
      <td>${alerts}</td>
      <td class="mono">${escapeHtml(s.last_alert || '—')}</td>
    </tr>`;
  }).join('');
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(str) { return String(str).replace(/"/g,'&quot;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.classList.remove('show'), 4000);
}

document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('vendorFilter').addEventListener('change', renderTable);
document.getElementById('statusFilter').addEventListener('change', renderTable);

loadData();
</script>
</body>
</html>
