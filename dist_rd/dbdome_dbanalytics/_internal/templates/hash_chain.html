<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Immutable Audit Hash Chain - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tab-content{padding:12px 16px;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:130px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-valid{background:#0a1f0a;color:var(--green-text);}
  .badge-invalid{background:#3a0010;color:var(--red-text);}
  .badge-pending{background:#2a2000;color:var(--yellow);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .verify-banner{padding:12px 16px;border-radius:4px;margin-bottom:12px;font-size:13px;display:none;}
  .verify-ok{background:#0a1f0a;border:1px solid var(--green);color:var(--green-text);}
  .verify-fail{background:#3a0010;border:1px solid var(--red);color:var(--red-text);}
  .hash-mono{font-family:monospace;font-size:10px;color:var(--text-secondary);}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Immutable Audit Hash Chain</div>
</div>

<div class="tab-content">
  <div class="stats-row" id="chain-stats"></div>
  <div class="verify-banner" id="verify-banner"></div>

  <div class="panel">
    <div class="panel-header">
      <span>Hash Chain Status</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-sm" onclick="loadStatus()">Refresh</button>
        <button class="btn btn-primary" id="verify-btn" onclick="runVerify()">Run Full Verification</button>
      </div>
    </div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Checkpoint #</th><th>Last Verified At</th><th>Rows Verified</th>
          <th>Last Hashed ID</th><th>Chain Tip (first 20 chars)</th>
          <th>Result</th><th>Broken At ID</th><th>Error</th>
        </tr></thead>
        <tbody id="checkpoints-body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Recent Audit Log with Hashes</span>
      <button class="btn-sm" onclick="loadRecentRows()">Refresh</button>
    </div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Audit ID</th><th>Event Time</th><th>Server</th><th>User</th>
          <th>Action</th><th>Row Hash (first 20)</th><th>Prev Hash (first 20)</th><th>Hashed</th>
        </tr></thead>
        <tbody id="rows-body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,16); }
function short(h){ return h ? h.substring(0,20)+'…' : '—'; }

async function loadStatus(){
  const res=await fetch('/api/hash-chain/status');
  const data=await res.json();
  const s=data.stats||{};
  document.getElementById('chain-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value">${s.total_hashed||0}</div><div class="stat-label">Rows Hashed</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-secondary)">${s.total_unhashed||0}</div><div class="stat-label">Rows Pending Hash</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:${(s.last_valid===false)?'var(--red-text)':'var(--green-text)'}">${s.last_valid===null?'—':s.last_valid?'VALID':'INVALID'}</div><div class="stat-label">Last Verification</div></div>
    <div class="stat-panel"><div class="stat-value">${s.checkpoint_count||0}</div><div class="stat-label">Checkpoints</div></div>
  `;
  const cps=data.checkpoints||[];
  document.getElementById('checkpoints-body').innerHTML=cps.length?cps.map(c=>`<tr>
    <td>#${c.checkpoint_id}</td>
    <td style="font-size:11px">${fmtTs(c.verified_at)}</td>
    <td>${c.rows_hashed||0}</td>
    <td>${c.last_hashed_id}</td>
    <td class="hash-mono">${short(c.last_hash)}</td>
    <td><span class="badge ${c.is_valid?'badge-valid':'badge-invalid'}">${c.is_valid?'VALID':'INVALID'}</span></td>
    <td>${c.broken_at_id||'—'}</td>
    <td style="font-size:10px;color:var(--red-text)">${c.error_detail||''}</td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No verification checkpoints yet — run verification</td></tr>';
}

async function loadRecentRows(){
  const res=await fetch('/api/hash-chain/recent-rows');
  const data=await res.json();
  const rows=data.rows||[];
  document.getElementById('rows-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td>${r.audit_id}</td>
    <td style="font-size:11px">${fmtTs(r.event_time)}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="font-size:11px">${r.db_user||''}</td>
    <td><span style="font-size:11px">${r.action_taken||''}</span></td>
    <td class="hash-mono">${short(r.row_hash)}</td>
    <td class="hash-mono">${short(r.prev_hash)}</td>
    <td><span class="badge ${r.row_hash?'badge-valid':'badge-pending'}">${r.row_hash?'YES':'PENDING'}</span></td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No rows</td></tr>';
}

async function runVerify(){
  const btn=document.getElementById('verify-btn');
  btn.disabled=true;
  btn.innerHTML='Verifying<span class="spinner"></span>';
  const res=await fetch('/api/hash-chain/verify',{method:'POST'});
  const data=await res.json();
  btn.disabled=false;
  btn.innerHTML='Run Full Verification';
  const banner=document.getElementById('verify-banner');
  if(data.is_valid){
    banner.className='verify-banner verify-ok';
    banner.textContent=`Chain VALID — ${data.rows_checked} rows verified. Tip: ${(data.last_hash||'').substring(0,32)}…`;
  } else {
    banner.className='verify-banner verify-fail';
    banner.textContent=`Chain INVALID — broken at audit_id=${data.broken_at_id}. ${data.error_detail||''}`;
  }
  banner.style.display='block';
  loadStatus();
}

loadStatus();
loadRecentRows();
</script>
</body>
</html>
