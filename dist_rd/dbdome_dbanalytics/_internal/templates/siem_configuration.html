<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Configuration Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/siem_configuration.css">
</head>
<body>
    <header class="header">
        <div class="logo">dbdome</div>
    </header>
    
    <main class="container">
        <form class="custom-form" id="customForm" action="/submit_siem_configuration" method="POST">
            <h1>SIEM Configuration</h1>
            
            <div class="form-group">
                <label for="select-vendor">Select Vendor</label>
                <select id="select_vendor" name="select_vendor" required>
                    <option value="" disabled selected></option>
                    <option value="splunk">Splunk Enterprise Security (ES)</option>
                    <option value="qradar">IBM QRadar</option>
                    <option value="sentinel">Microsoft Sentinel (Azure)</option>
                    <option value="elastic">Elastic SIEM</option>
                    <option value="rapid">Rapid7 InsightIDR</option>
                    <option value="sumo">Sumo Logic Cloud SIEM</option>
                    <option value="crowdstrike">CrowdStrike Falcon</option>
                    <option value="wazuh">Wazuh</option>
                    <option value="arcsight">Micro Focus ArcSight</option>
                    <option value="syslog">Generic Syslog (RFC 5424)</option>
                </select>
            </div>

            <!-- Generic vendors (splunk/qradar/sentinel/arcsight/elastic/sumo/syslog) -->
            <div class="form-group" id="gen_format_group" style="display:none">
                <label for="gen_format">Event Format</label>
                <select id="gen_format" name="gen_format">
                    <option value="">(vendor default)</option>
                    <option value="cef">CEF — ArcSight, Splunk, Sentinel, QRadar</option>
                    <option value="leef">LEEF — IBM QRadar native</option>
                    <option value="rfc5424">RFC 5424 syslog (structured)</option>
                    <option value="rfc3164">RFC 3164 syslog (legacy BSD)</option>
                    <option value="json">JSON / ECS — Elastic, Sumo, collectors</option>
                </select>
            </div>
            <div class="form-group" id="gen_transport_group" style="display:none">
                <label for="gen_transport">Transport</label>
                <select id="gen_transport" name="gen_transport">
                    <option value="">(vendor default)</option>
                    <option value="tcp">TCP (syslog, port 514)</option>
                    <option value="udp">UDP (syslog, port 514)</option>
                    <option value="tls">TLS (encrypted syslog, port 6514)</option>
                    <option value="http">HTTPS ingest (Splunk HEC / Sumo collector)</option>
                </select>
            </div>
            <div class="form-group" id="gen_port_group" style="display:none">
                <label for="gen_port">Port</label>
                <input type="number" id="gen_port" name="gen_port" min="1" max="65535" value="514">
            </div>

            <!-- Wazuh-only: protocol + syslog port -->
            <div class="form-group" id="wz_proto_group" style="display:none">
                <label for="wz_proto">Wazuh Protocol</label>
                <select id="wz_proto" name="wz_proto">
                    <option value="syslog" selected>Syslog over TCP</option>
                    <option value="udp">Syslog over UDP</option>
                </select>
            </div>
            <div class="form-group" id="wz_port_group" style="display:none">
                <label for="wz_port">Syslog Port</label>
                <input type="number" id="wz_port" name="wz_port" min="1" max="65535" value="514">
            </div>

            <!-- CrowdStrike-only: ingestion mode -->
            <div class="form-group" id="cs_mode_group" style="display:none">
                <label for="cs_mode">CrowdStrike Mode</label>
                <select id="cs_mode" name="cs_mode">
                    <option value="logscale" selected>Falcon LogScale (HTTP Ingest API)</option>
                    <option value="syslog">Falcon SIEM Connector (Syslog / CEF over TCP)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="url" id="url_label">URL</label>
                <input type="text" id="url" name="url" required>
            </div>

            <!-- CrowdStrike syslog-only: collector port -->
            <div class="form-group" id="cs_port_group" style="display:none">
                <label for="cs_port">Collector Port</label>
                <input type="number" id="cs_port" name="cs_port" min="1" max="65535">
            </div>

            <div class="form-group">
                <label for="secret" id="secret_label">Secret</label>
                <input type="text" id="secret" name="secret" required>
            </div>

             <button type="submit" class="submit-btn" id="deployBtn">Submit</button>
        </form>

        <script>
        // CrowdStrike needs mode-specific fields:
        //   logscale -> URL = LogScale base URL, Secret = ingest token
        //   syslog   -> URL = collector IP/host + port, Secret unused
        (function () {
            var vendor = document.getElementById('select_vendor');
            var mode = document.getElementById('cs_mode');
            var modeGroup = document.getElementById('cs_mode_group');
            var portGroup = document.getElementById('cs_port_group');
            var port = document.getElementById('cs_port');
            var urlLabel = document.getElementById('url_label');
            var secret = document.getElementById('secret');
            var secretLabel = document.getElementById('secret_label');
            var wzProtoGroup = document.getElementById('wz_proto_group');
            var wzPortGroup = document.getElementById('wz_port_group');
            var wzPort = document.getElementById('wz_port');
            var GENERIC = ['splunk','qradar','sentinel','arcsight','elastic','sumo','syslog'];
            var genFormatGroup = document.getElementById('gen_format_group');
            var genTransportGroup = document.getElementById('gen_transport_group');
            var genPortGroup = document.getElementById('gen_port_group');
            var genPort = document.getElementById('gen_port');
            var genTransport = document.getElementById('gen_transport');

            function refresh() {
                var cs = vendor.value === 'crowdstrike';
                var wz = vendor.value === 'wazuh';
                var gen = GENERIC.indexOf(vendor.value) !== -1;
                var syslog = cs && mode.value === 'syslog';

                genFormatGroup.style.display = gen ? '' : 'none';
                genTransportGroup.style.display = gen ? '' : 'none';
                genPortGroup.style.display = gen ? '' : 'none';
                genPort.required = gen;
                if (gen && genTransport.value === 'tls' && genPort.value === '514') genPort.value = '6514';
                if (gen) {
                    urlLabel.textContent = genTransport.value === 'http'
                        ? 'Collector URL (https://…)' : 'Collector IP / Host';
                    secretLabel.textContent = 'Token / Secret (HTTPS ingest only — optional)';
                    secret.required = false;
                    modeGroup.style.display = 'none';
                    portGroup.style.display = 'none';
                    wzProtoGroup.style.display = 'none';
                    wzPortGroup.style.display = 'none';
                    port.required = false;
                    wzPort.required = false;
                    return;
                }
                modeGroup.style.display = cs ? '' : 'none';
                portGroup.style.display = syslog ? '' : 'none';
                port.required = syslog;
                wzProtoGroup.style.display = wz ? '' : 'none';
                wzPortGroup.style.display = wz ? '' : 'none';
                wzPort.required = wz;
                urlLabel.textContent = wz ? 'Wazuh Manager IP / Host'
                    : (!cs ? 'URL'
                       : (syslog ? 'Collector IP / Host' : 'LogScale URL (e.g. https://cloud.humio.com)'));
                secretLabel.textContent = wz ? 'Secret (not used for Wazuh)'
                    : (!cs ? 'Secret'
                       : (syslog ? 'Secret (not used for syslog)' : 'Ingest Token'));
                secret.required = !(syslog || wz);
            }
            vendor.addEventListener('change', refresh);
            mode.addEventListener('change', refresh);
            genTransport.addEventListener('change', refresh);
            refresh();
        })();
        </script>
        
        
        <canvas id="confettiCanvas"></canvas>
    </main>
    

</body>
</html>
