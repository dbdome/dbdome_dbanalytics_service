<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retention Policy Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/retention_policy.css">
</head>
<body>
    <header class="header">
        <div class="logo">dbdome</div>
    </header>
    
    <main class="container">
        <form class="custom-form" id="customForm" action="/submit_retention_policy" method="POST">
            <h1>Retention policy</h1>
            
            <div class="form-group">
                <label for="select-server">Select Server</label>
                <select id="select-server" name="select-server" required>
                    <option value="" disabled selected></option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="select-table">Select Table</label>
                <select id="select-table" name="select-table" required>
                    <option value="" disabled selected></option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="days-to-keep">Days to keep (Numbers Only)</label>
                <input type="number" id="days-to-keep" name="days-to-keep" required>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
        </form>
        
        <div class="success-message" id="successMessage">
            Form submitted successfully
        </div>
        
        <canvas id="confettiCanvas"></canvas>
    </main>
    
    <script src="/static/js/retention_policy.js"></script>
</body>
</html>
