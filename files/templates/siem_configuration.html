<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Configuration Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/siem_configuration.css">
</head>
<body>
    <header class="header">
        <div class="logo">dbdome</div>
    </header>
    
    <main class="container">
        <form class="custom-form" id="customForm" action="/submit_siem_configuration" method="POST">
            <h1>SIEM Configuration</h1>
            
            <div class="form-group">
                <label for="select-vendor">Select Vendor</label>
                <select id="select_vendor" name="select_vendor" required>
                    <option value="" disabled selected></option>
                    <option value="splunk">Splunk Enterprise Security (ES)</option>
                    <option value="qradar">IBM QRadar</option>
                    <option value="sentinel">Microsoft Sentinel (Azure)</option>
                    <option value="elastic">Elastic SIEM</option>
                    <option value="rapid">Rapid7 InsightIDR</option>
                    <option value="sumo">Sumo Logic Cloud SIEM</option>
                    <option value="crowdstrike">CrowdStrike Falcon</option>
                </select>
            </div>

            <!-- CrowdStrike-only: ingestion mode -->
            <div class="form-group" id="cs_mode_group" style="display:none">
                <label for="cs_mode">CrowdStrike Mode</label>
                <select id="cs_mode" name="cs_mode">
                    <option value="logscale" selected>Falcon LogScale (HTTP Ingest API)</option>
                    <option value="syslog">Falcon SIEM Connector (Syslog / CEF over TCP)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="url" id="url_label">URL</label>
                <input type="text" id="url" name="url" required>
            </div>

            <!-- CrowdStrike syslog-only: collector port -->
            <div class="form-group" id="cs_port_group" style="display:none">
                <label for="cs_port">Collector Port</label>
                <input type="number" id="cs_port" name="cs_port" min="1" max="65535">
            </div>

            <div class="form-group">
                <label for="secret" id="secret_label">Secret</label>
                <input type="text" id="secret" name="secret" required>
            </div>

             <button type="submit" class="submit-btn" id="deployBtn">Submit</button>
        </form>

        <script>
        // CrowdStrike needs mode-specific fields:
        //   logscale -> URL = LogScale base URL, Secret = ingest token
        //   syslog   -> URL = collector IP/host + port, Secret unused
        (function () {
            var vendor = document.getElementById('select_vendor');
            var mode = document.getElementById('cs_mode');
            var modeGroup = document.getElementById('cs_mode_group');
            var portGroup = document.getElementById('cs_port_group');
            var port = document.getElementById('cs_port');
            var urlLabel = document.getElementById('url_label');
            var secret = document.getElementById('secret');
            var secretLabel = document.getElementById('secret_label');

            function refresh() {
                var cs = vendor.value === 'crowdstrike';
                var syslog = cs && mode.value === 'syslog';
                modeGroup.style.display = cs ? '' : 'none';
                portGroup.style.display = syslog ? '' : 'none';
                port.required = syslog;
                urlLabel.textContent = !cs ? 'URL'
                    : (syslog ? 'Collector IP / Host' : 'LogScale URL (e.g. https://cloud.humio.com)');
                secretLabel.textContent = !cs ? 'Secret'
                    : (syslog ? 'Secret (not used for syslog)' : 'Ingest Token');
                secret.required = !syslog;
            }
            vendor.addEventListener('change', refresh);
            mode.addEventListener('change', refresh);
            refresh();
        })();
        </script>
        
        
        <canvas id="confettiCanvas"></canvas>
    </main>
    

</body>
</html>
