<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert Thresholds - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }

  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { filter: brightness(1.15); }
  .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn-edit { color: var(--blue); border-color: var(--blue); }
  .btn-delete { color: var(--red-text); border-color: var(--red-text); }

  .stats-row { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
  .stat-panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 20px; flex: 1; min-width: 140px; text-align: center;
  }
  .stat-value { font-size: 28px; font-weight: 500; line-height: 1.2; }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

  .content-row { display: flex; gap: 8px; padding: 0 16px; margin-top: 8px; align-items: flex-start; }
  .content-row .panel { margin: 0; flex-shrink: 0; }
  .content-row .panel:first-child { width: 340px; }
  .content-row .panel:last-child { flex: 1; min-width: 0; }

  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 16px; overflow-x: auto; }

  .form-group { margin-bottom: 14px; }
  .form-group label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
  .form-group select, .form-group input {
    width: 100%; background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 8px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .form-group select:focus, .form-group input:focus { border-color: var(--blue); outline: none; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 10px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge-info { background: rgba(51, 162, 229, 0.15); color: var(--blue); }
  .badge-warning { background: rgba(236, 187, 19, 0.15); color: var(--yellow); }
  .badge-critical { background: rgba(209, 14, 92, 0.15); color: var(--red-text); }

  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--green-text);
    border-radius: 4px; padding: 12px 20px; color: var(--green-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.error { border-color: var(--red-text); color: var(--red-text); }

  .search-input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 4px; font-size: 12px; width: 200px;
  }

  .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  .table-scroll { max-height: 65vh; overflow-y: auto; }

  @media (max-width: 900px) {
    .content-row { flex-direction: column; }
    .content-row .panel:first-child { width: 100%; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" style="height:28px" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Alert Thresholds</div>
</nav>

<div class="toolbar">
  <div>
    <label>Search alert name</label>
    <input type="text" id="searchInput" class="search-input" placeholder="alert name..." />
  </div>
  <div>
    <label>Level</label>
    <select id="levelFilter">
      <option value="all">All Levels</option>
      <option value="1">Info</option>
      <option value="2">Warning</option>
      <option value="3">Critical</option>
    </select>
  </div>
  <div style="align-self: flex-end;">
    <button class="btn btn-primary" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="stats-row" id="statsBar"></div>

<div class="content-row">
  <div class="panel">
    <div class="panel-header">
      <span id="formTitle">Create Threshold</span>
    </div>
    <div class="panel-body">
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label>Alert Name</label>
        <select id="alertSelect">
          <option value="">-- Select Alert --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Level</label>
        <select id="levelSelect">
          <option value="1">1 - Info</option>
          <option value="2">2 - Warning</option>
          <option value="3">3 - Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label>Value Start</label>
        <input type="number" id="valueStart" placeholder="0" />
      </div>
      <div class="form-group">
        <label>Value End</label>
        <input type="number" id="valueEnd" placeholder="100" />
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" onclick="saveThreshold()">Save</button>
        <button class="btn btn-sm" onclick="resetForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Thresholds</span>
    </div>
    <div class="panel-body" style="padding: 0;">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Alert Name</th>
              <th>Level</th>
              <th>Value Start</th>
              <th>Value End</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allThresholds = [];
let allAlerts = [];

const levelLabels = { 1: 'Info', 2: 'Warning', 3: 'Critical' };
const levelBadgeClass = { 1: 'badge-info', 2: 'badge-warning', 3: 'badge-critical' };

async function loadData() {
  try {
    const resp = await fetch('/api/alert-thresholds');
    const data = await resp.json();
    allThresholds = data.thresholds || [];
    allAlerts = data.alerts || [];
    populateAlertSelect();
    updateStats();
    renderTable();
  } catch (e) {
    console.error('Failed to load:', e);
    showToast('Failed to load data: ' + e.message, true);
  }
}

function populateAlertSelect() {
  const sel = document.getElementById('alertSelect');
  sel.innerHTML = '<option value="">-- Select Alert --</option>' +
    allAlerts.map(a => `<option value="${a.alert_id}">${a.alert_name}</option>`).join('');
}

function updateStats() {
  const total = allThresholds.length;
  const info = allThresholds.filter(t => t.level === 1).length;
  const warning = allThresholds.filter(t => t.level === 2).length;
  const critical = allThresholds.filter(t => t.level === 3).length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-emphasis)">${total}</div><div class="stat-label">Total Thresholds</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${info}</div><div class="stat-label">Info</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${warning}</div><div class="stat-label">Warning</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${critical}</div><div class="stat-label">Critical</div></div>
  `;
}

function getAlertName(alertId) {
  const a = allAlerts.find(a => a.alert_id === alertId);
  return a ? a.alert_name : alertId;
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const levelVal = document.getElementById('levelFilter').value;

  let filtered = allThresholds.filter(t => {
    if (search) {
      const name = getAlertName(t.alert_id).toLowerCase();
      if (!name.includes(search)) return false;
    }
    if (levelVal !== 'all' && t.level !== parseInt(levelVal)) return false;
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No thresholds found. Use the form to create one.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(t => {
    const name = getAlertName(t.alert_id);
    const lvl = t.level;
    const badgeClass = levelBadgeClass[lvl] || 'badge-info';
    const label = levelLabels[lvl] || lvl;
    return `<tr>
      <td><b>${name}</b></td>
      <td><span class="badge ${badgeClass}">${label}</span></td>
      <td>${t.value_start}</td>
      <td>${t.value_end}</td>
      <td>
        <button class="btn-sm btn-edit" onclick="editThreshold(${t.threshold_id})">Edit</button>
        <button class="btn-sm btn-delete" onclick="deleteThreshold(${t.threshold_id})">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

function editThreshold(id) {
  const t = allThresholds.find(t => t.threshold_id === id);
  if (!t) return;
  document.getElementById('editId').value = t.threshold_id;
  document.getElementById('alertSelect').value = t.alert_id;
  document.getElementById('levelSelect').value = t.level;
  document.getElementById('valueStart').value = t.value_start;
  document.getElementById('valueEnd').value = t.value_end;
  document.getElementById('formTitle').textContent = 'Edit Threshold';
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('alertSelect').value = '';
  document.getElementById('levelSelect').value = '1';
  document.getElementById('valueStart').value = '';
  document.getElementById('valueEnd').value = '';
  document.getElementById('formTitle').textContent = 'Create Threshold';
}

async function saveThreshold() {
  const alertId = document.getElementById('alertSelect').value;
  const level = parseInt(document.getElementById('levelSelect').value);
  const valueStart = parseFloat(document.getElementById('valueStart').value);
  const valueEnd = parseFloat(document.getElementById('valueEnd').value);
  const editId = document.getElementById('editId').value;

  if (!alertId) { showToast('Please select an alert', true); return; }
  if (isNaN(valueStart) || isNaN(valueEnd)) { showToast('Please enter valid numeric values', true); return; }

  const payload = { alert_id: alertId, level, value_start: valueStart, value_end: valueEnd };
  if (editId) payload.threshold_id = parseInt(editId);

  try {
    const resp = await fetch('/submit-alert-threshold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    showToast(data.message || 'Threshold saved');
    resetForm();
    loadData();
  } catch (e) {
    showToast('Error saving threshold: ' + e.message, true);
  }
}

async function deleteThreshold(id) {
  if (!confirm('Delete this threshold?')) return;
  try {
    const resp = await fetch('/api/delete-threshold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ threshold_id: id })
    });
    const data = await resp.json();
    showToast(data.message || 'Threshold deleted');
    loadData();
  } catch (e) {
    showToast('Error deleting threshold: ' + e.message, true);
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

document.getElementById('levelFilter').addEventListener('change', renderTable);
document.getElementById('searchInput').addEventListener('input', renderTable);

loadData();
</script>
</body>
</html>
