<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engage Custom Metrics to Server Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/custom_metrics.css">
</head>
<body>
    <header class="header">
        <div class="logo">dbdome</div>
    </header>
    
    <main class="container">
        <form class="custom_form" id="custom_form" action="/submit_custom_metrics" method="POST">
            <h1>Engage Custom metrics to server</h1>
            
            <div class="form-group">
                <label for="metric-name">Metric_name</label>
                <input type="text" id="metric_name" name="metric_name" required>
            </div>

            <div class="form-group">
                <label for="metric-Description">Metric description</label>
                <input type="text" id="metric_desc" name="metric_desc" required>
            </div>
            
            <div class="form-group">
                <label for="query">Query</label>
                <textarea id="query" name="query" rows="3" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="servers-selector">Servers Selector</label>
                <select id="db_vendor_selector" name="db_vendor_selector" required>
                    <option value="" disabled selected></option>
                    <option value="MSSQL">mssql</option>
                    <option value="POSTGRES">postgres</option>
                    <option value="ORACLE">oracle</option>
                    <option value="MYSQL">mysql</option>
                </select>
            </div>
             <div class="form-group">
                <label for="action-select">Metric_enable</label>
                <select id="action_select" name="action_select" required>
                    <option value="" disabled selected></option>
                    <option value="1">Enable</option>
                    <option value="0">Disable</option>
                </select>
            </div>
            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
        
        <div class="success-message" id="successMessage">
            Form submitted successfully
        </div>
        
        <canvas id="confettiCanvas"></canvas>
    </main>
    
    <script src="../static/js/custom_metrics.js"></script>
</body>
</html>
