<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert Rules - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }

  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn-edit { color: var(--blue); border-color: var(--blue); }
  .btn-delete { color: var(--red-text); border-color: var(--red-text); }

  .stats-row { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
  .stat-panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 20px; flex: 1; min-width: 140px; text-align: center;
  }
  .stat-value { font-size: 28px; font-weight: 500; line-height: 1.2; }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

  .content-row { display: flex; gap: 8px; padding: 0 16px; margin-top: 8px; align-items: flex-start; }
  .content-row .panel { margin: 0; flex-shrink: 0; }
  .content-row .panel:first-child { width: 360px; }
  .content-row .panel:last-child { flex: 1; min-width: 0; }

  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 16px; overflow-x: auto; }

  .form-group { margin-bottom: 14px; }
  .form-group label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
  .form-group select, .form-group input[type="number"] {
    width: 100%; background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 8px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .form-group select:focus, .form-group input:focus { border-color: var(--blue); outline: none; }

  .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .checkbox-group input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--blue-base); cursor: pointer;
  }
  .checkbox-group label { font-size: 13px; color: var(--text-primary); margin: 0; cursor: pointer; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 10px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge-sec { background: rgba(209, 14, 92, 0.15); color: var(--red-text); }
  .badge-perf { background: rgba(51, 162, 229, 0.15); color: var(--blue); }
  .badge-hlth { background: rgba(26, 127, 75, 0.2); color: var(--green-text); }
  .badge-on { background: rgba(26, 127, 75, 0.2); color: var(--green-text); }
  .badge-off { background: rgba(100, 100, 100, 0.2); color: var(--text-secondary); }

  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--green-text);
    border-radius: 4px; padding: 12px 20px; color: var(--green-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.error { border-color: var(--red-text); color: var(--red-text); }

  .search-input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 4px; font-size: 12px; width: 200px;
  }

  .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  .table-scroll { max-height: 65vh; overflow-y: auto; }

  @media (max-width: 900px) {
    .content-row { flex-direction: column; }
    .content-row .panel:first-child { width: 100%; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" style="height:28px" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Alert Rules</div>
</nav>

<div class="toolbar">
  <div>
    <label>Domain</label>
    <select id="domainFilter">
      <option value="all">All Domains</option>
      <option value="SEC">SEC</option>
      <option value="PERF">PERF</option>
      <option value="HLTH">HLTH</option>
    </select>
  </div>
  <div>
    <label>Search issue ID</label>
    <input type="text" id="searchInput" class="search-input" placeholder="issue id..." />
  </div>
  <div style="align-self: flex-end;">
    <button class="btn btn-primary" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="stats-row" id="statsBar"></div>

<div class="content-row">
  <div class="panel">
    <div class="panel-header">
      <span id="formTitle">Create Alert Rule</span>
    </div>
    <div class="panel-body">
      <input type="hidden" id="editId" value="" />
      <div class="form-group">
        <label>Issue ID</label>
        <select id="issueSelect">
          <option value="">-- Select Issue --</option>
        </select>
      </div>
      <div class="form-group">
        <label>Root Cause Number</label>
        <input type="number" id="rootcauseNumber" placeholder="1" min="1" />
      </div>
      <div class="form-group">
        <label>Alert / Event Rule</label>
        <select id="alertSelect">
          <option value="">-- Select Alert --</option>
        </select>
      </div>
      <div style="margin-bottom: 14px;">
        <div class="checkbox-group">
          <input type="checkbox" id="sendMail" />
          <label for="sendMail">Send Mail Alert</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="sendSiem" />
          <label for="sendSiem">Send SIEM Alert</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="sendDiagnosis" />
          <label for="sendDiagnosis">Send Diagnosis Evidence</label>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" onclick="saveRule()">Save</button>
        <button class="btn btn-sm" onclick="resetForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Alert Rules</span>
    </div>
    <div class="panel-body" style="padding: 0;">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Issue ID</th>
              <th>Rootcause #</th>
              <th>Alert</th>
              <th>Mail</th>
              <th>SIEM</th>
              <th>Diagnosis</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allRules = [];
let allIssues = [];
let allAlerts = [];

async function loadData() {
  try {
    const resp = await fetch('/api/alert-rules');
    const data = await resp.json();
    allRules = data.rules || [];
    allIssues = data.issues || [];
    allAlerts = data.alerts || [];
    populateSelects();
    updateStats();
    renderTable();
  } catch (e) {
    console.error('Failed to load:', e);
    showToast('Failed to load data: ' + e.message, true);
  }
}

function populateSelects() {
  const issueSel = document.getElementById('issueSelect');
  issueSel.innerHTML = '<option value="">-- Select Issue --</option>' +
    allIssues.map(i => `<option value="${i.issue_id}">${i.issue_id} - ${i.issue_name || ''}</option>`).join('');

  const alertSel = document.getElementById('alertSelect');
  alertSel.innerHTML = '<option value="">-- Select Alert --</option>' +
    allAlerts.map(a => `<option value="${a.alert_id}">${a.alert_name}</option>`).join('');
}

function updateStats() {
  const total = allRules.length;
  const sec = allRules.filter(r => getIssueDomain(r.issue_id) === 'SEC').length;
  const perf = allRules.filter(r => getIssueDomain(r.issue_id) === 'PERF').length;
  const hlth = allRules.filter(r => getIssueDomain(r.issue_id) === 'HLTH').length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-emphasis)">${total}</div><div class="stat-label">Total Rules</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${sec}</div><div class="stat-label">Security</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${perf}</div><div class="stat-label">Performance</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${hlth}</div><div class="stat-label">Health</div></div>
  `;
}

function getIssueDomain(issueId) {
  const issue = allIssues.find(i => i.issue_id === issueId);
  return issue ? (issue.domain || '') : '';
}

function getIssueName(issueId) {
  const issue = allIssues.find(i => i.issue_id === issueId);
  return issue ? (issue.issue_name || issueId) : issueId;
}

function getAlertName(alertId) {
  const a = allAlerts.find(a => a.alert_id === alertId);
  return a ? a.alert_name : alertId;
}

function flagBadge(val) {
  return val ? '<span class="badge badge-on">ON</span>' : '<span class="badge badge-off">OFF</span>';
}

function domainBadge(domain) {
  const cls = { SEC: 'badge-sec', PERF: 'badge-perf', HLTH: 'badge-hlth' };
  return domain ? `<span class="badge ${cls[domain] || ''}">${domain}</span>` : '';
}

function renderTable() {
  const domainVal = document.getElementById('domainFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = allRules.filter(r => {
    if (domainVal !== 'all' && getIssueDomain(r.issue_id) !== domainVal) return false;
    if (search) {
      const id = String(r.issue_id).toLowerCase();
      const name = getIssueName(r.issue_id).toLowerCase();
      if (!id.includes(search) && !name.includes(search)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No alert rules found. Use the form to create one.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const domain = getIssueDomain(r.issue_id);
    const alertName = getAlertName(r.alert_id);
    return `<tr>
      <td>${domainBadge(domain)} <b>${r.issue_id}</b></td>
      <td>${r.rootcause_number || '-'}</td>
      <td>${alertName}</td>
      <td>${flagBadge(r.send_mail)}</td>
      <td>${flagBadge(r.send_siem)}</td>
      <td>${flagBadge(r.send_diagnosis)}</td>
      <td>
        <button class="btn-sm btn-edit" onclick="editRule(${r.rule_id})">Edit</button>
        <button class="btn-sm btn-delete" onclick="deleteRule(${r.rule_id})">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

function editRule(id) {
  const r = allRules.find(r => r.rule_id === id);
  if (!r) return;
  document.getElementById('editId').value = r.rule_id;
  document.getElementById('issueSelect').value = r.issue_id;
  document.getElementById('rootcauseNumber').value = r.rootcause_number || '';
  document.getElementById('alertSelect').value = r.alert_id;
  document.getElementById('sendMail').checked = !!r.send_mail;
  document.getElementById('sendSiem').checked = !!r.send_siem;
  document.getElementById('sendDiagnosis').checked = !!r.send_diagnosis;
  document.getElementById('formTitle').textContent = 'Edit Alert Rule';
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('issueSelect').value = '';
  document.getElementById('rootcauseNumber').value = '';
  document.getElementById('alertSelect').value = '';
  document.getElementById('sendMail').checked = false;
  document.getElementById('sendSiem').checked = false;
  document.getElementById('sendDiagnosis').checked = false;
  document.getElementById('formTitle').textContent = 'Create Alert Rule';
}

async function saveRule() {
  const issueId = document.getElementById('issueSelect').value;
  const rootcauseNumber = parseInt(document.getElementById('rootcauseNumber').value);
  const alertId = document.getElementById('alertSelect').value;
  const sendMail = document.getElementById('sendMail').checked;
  const sendSiem = document.getElementById('sendSiem').checked;
  const sendDiagnosis = document.getElementById('sendDiagnosis').checked;
  const editId = document.getElementById('editId').value;

  if (!issueId) { showToast('Please select an issue', true); return; }
  if (!alertId) { showToast('Please select an alert', true); return; }
  if (isNaN(rootcauseNumber) || rootcauseNumber < 1) { showToast('Please enter a valid root cause number', true); return; }

  const payload = {
    issue_id: issueId,
    rootcause_number: rootcauseNumber,
    alert_id: alertId,
    send_mail: sendMail,
    send_siem: sendSiem,
    send_diagnosis: sendDiagnosis
  };
  if (editId) payload.rule_id = parseInt(editId);

  try {
    const resp = await fetch('/submit-alert-rule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    showToast(data.message || 'Rule saved');
    resetForm();
    loadData();
  } catch (e) {
    showToast('Error saving rule: ' + e.message, true);
  }
}

async function deleteRule(id) {
  if (!confirm('Delete this alert rule?')) return;
  try {
    const resp = await fetch('/api/delete-alert-rule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rule_id: id })
    });
    const data = await resp.json();
    showToast(data.message || 'Rule deleted');
    loadData();
  } catch (e) {
    showToast('Error deleting rule: ' + e.message, true);
  }
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

document.getElementById('domainFilter').addEventListener('change', renderTable);
document.getElementById('searchInput').addEventListener('input', renderTable);

loadData();
</script>
</body>
</html>
