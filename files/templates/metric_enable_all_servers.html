<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/metric_enable_style.css">
</head>
<body>
    <header class="header">
        <div class="logo">dbdome</div>
    </header>
    
    <main class="container">
        <form class="confirm-form" id="confirmForm" action="/submit_metrics_enable_all_servers" method="POST">
            <h1>Please Confirm</h1>
            
            <div class="form-group">
                <label for="action-select">Metric_enable</label>
                <select id="action_select" name="action_select" required>
                    <option value="" disabled selected></option>
                    <option value="1">Enable</option>
                    <option value="0">Disable</option>
                </select>
            </div>
            <input type="hidden" id="row_id" name="row_id" value="">
            
            <button type="submit" class="confirm-btn">Confirm</button>
        </form>
        
        <div class="success-message" id="successMessage">
            The form was submitted successfully
        </div>
        
        <canvas id="confettiCanvas"></canvas>
    </main>
    
    <script>
    // Read row_id from URL
    const urlParams = new URLSearchParams(window.location.search);
    const row_id = urlParams.get("row_id");

    // Inject it into hidden field
    if (row_id) {
        document.getElementById("row_id").value = row_id;
    }
</script>
</body>
</html>
