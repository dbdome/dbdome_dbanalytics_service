<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DDL Audit - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);display:flex;align-items:center;gap:8px;}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-critical{background:#3a0010;color:#ff3a6e;}
  .badge-high{background:#3a1a00;color:var(--orange);}
  .badge-medium{background:#2a2000;color:var(--yellow);}
  .badge-low{background:#0a1f0a;color:var(--green-text);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .filter-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
  .filter-bar select,.filter-bar input{background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);padding:5px 10px;border-radius:4px;font-size:12px;font-family:inherit;}
  .text-mono{font-family:monospace;font-size:11px;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">DDL Audit Log</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">DDL Events</div>
  <div class="tab" onclick="switchTab('summary')">Daily Summary</div>
</div>

<div class="tab-content active" id="tab-log">
  <div class="stats-row" id="ddl-stats"></div>
  <div class="filter-bar">
    <select id="f-cmd" onchange="loadLog()">
      <option value="">All Commands</option>
      <option>CREATE</option><option>ALTER</option><option>DROP</option><option>TRUNCATE</option><option>RENAME</option>
    </select>
    <select id="f-risk" onchange="loadLog()">
      <option value="">All Risk Levels</option>
      <option>HIGH</option><option>MEDIUM</option><option>LOW</option>
    </select>
    <select id="f-reg" onchange="loadLog()">
      <option value="">All Regulations</option>
      <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option>
    </select>
    <button class="btn-sm" onclick="loadLog()">Refresh</button>
  </div>
  <div class="panel">
    <div class="panel-header"><span>DDL Audit Events (last 500)</span></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Time</th><th>Server</th><th>DB User</th><th>Command</th>
          <th>Object</th><th>Risk</th><th>Regulation</th>
        </tr></thead>
        <tbody id="log-body"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-summary">
  <div class="panel">
    <div class="panel-header"><span>Daily DDL Summary</span><button class="btn-sm" onclick="loadSummary()">Refresh</button></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Date</th><th>Server</th><th>Total Events</th><th>DROP/TRUNCATE</th><th>High Risk</th>
        </tr></thead>
        <tbody id="summary-body"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['log','summary'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='log') loadLog();
  if(name==='summary') loadSummary();
}

function riskBadge(r){
  const m={HIGH:'badge-high',MEDIUM:'badge-medium',LOW:'badge-low',CRITICAL:'badge-critical'};
  return `<span class="badge ${m[r]||''}">${r||''}</span>`;
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,19); }

async function loadLog(){
  const cmd=document.getElementById('f-cmd').value;
  const risk=document.getElementById('f-risk').value;
  const reg=document.getElementById('f-reg').value;
  const params=new URLSearchParams();
  if(cmd) params.set('ddl_command',cmd);
  if(risk) params.set('risk_level',risk);
  if(reg)  params.set('regulation',reg);
  const res=await fetch('/api/ddl-audit/logs?'+params);
  const data=await res.json();
  const rows=data.rows||[];
  const high=rows.filter(r=>r.risk_level==='HIGH').length;
  const drop=rows.filter(r=>['DROP','TRUNCATE'].includes(r.ddl_command)).length;
  document.getElementById('ddl-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value">${rows.length}</div><div class="stat-label">Total Events</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--orange)">${high}</div><div class="stat-label">High Risk</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${drop}</div><div class="stat-label">DROP/TRUNCATE</div></div>
  `;
  const tbody=document.getElementById('log-body');
  tbody.innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="white-space:nowrap;font-size:11px">${fmtTs(r.event_time)}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="font-size:11px">${r.db_user||''}</td>
    <td class="text-mono" style="font-weight:600">${r.ddl_command||''}</td>
    <td style="font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.ddl_statement||''}">${r.object_name||''}</td>
    <td>${riskBadge(r.risk_level)}</td>
    <td style="font-size:11px">${r.regulation||''}</td>
  </tr>`).join(''):'<tr><td colspan="7" class="empty">No DDL events found</td></tr>';
}

async function loadSummary(){
  const res=await fetch('/api/ddl-audit/summary');
  const data=await res.json();
  const rows=data.rows||[];
  document.getElementById('summary-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-size:11px">${r.event_date||''}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="text-align:center">${r.total_events||0}</td>
    <td style="text-align:center;color:var(--red-text)">${r.destructive_events||0}</td>
    <td style="text-align:center">${riskBadge('HIGH').replace('></','>${r.high_risk_events||0}</')}</td>
  </tr>`).join(''):'<tr><td colspan="5" class="empty">No summary data</td></tr>';
}

loadLog();
</script>
</body>
</html>
