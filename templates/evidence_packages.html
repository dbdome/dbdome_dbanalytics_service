<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evidence Packages - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tab-content{padding:12px 16px;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .btn-dl{color:var(--blue);border-color:var(--blue);}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  .form-panel-body{padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-complete{background:#0a1f0a;color:var(--green-text);}
  .badge-generating{background:#0a1f3a;color:var(--blue);}
  .badge-failed{background:#3a0010;color:var(--red-text);}
  .badge-pending{background:#2a2000;color:var(--yellow);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .generate-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:20px;max-width:520px;margin-bottom:16px;}
  .generate-panel h3{font-size:14px;font-weight:500;color:var(--text-emphasis);margin-bottom:16px;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  .actions-cell{display:flex;gap:4px;}
  .text-mono{font-family:monospace;font-size:10px;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Audit Evidence Packages</div>
</div>

<div class="tab-content">
  <div class="stats-row" id="pkg-stats"></div>

  <div class="generate-panel">
    <h3>Generate Evidence Package</h3>
    <div class="form-row">
      <div class="form-group"><label>Regulation (blank = ALL)</label>
        <select id="gen-reg">
          <option value="">ALL</option><option>PCI-DSS</option><option>HIPAA</option>
          <option>GDPR</option><option>SOC2</option>
        </select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Period Start</label>
        <input type="date" id="gen-start"></div>
      <div class="form-group"><label>Period End</label>
        <input type="date" id="gen-end"></div>
    </div>
    <div class="form-group"><label>Generated By</label>
      <input id="gen-by" value="ui-user"></div>
    <button class="btn btn-primary" onclick="generatePackage()">Generate Package</button>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Evidence Packages</span>
      <button class="btn-sm" onclick="loadPackages()">Refresh</button>
    </div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>#</th><th>Package Name</th><th>Regulation</th><th>Period</th>
          <th>Generated By</th><th>Status</th><th>Size</th><th>Downloads</th>
        </tr></thead>
        <tbody id="packages-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',3500);
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,16); }
function fmtBytes(b){
  if(!b) return '';
  if(b>1048576) return (b/1048576).toFixed(1)+' MB';
  return (b/1024).toFixed(0)+' KB';
}

async function loadPackages(){
  const res=await fetch('/api/evidence-packages');
  const data=await res.json();
  const pkgs=data.packages||[];
  const complete=pkgs.filter(p=>p.status==='COMPLETE').length;
  const gen=pkgs.filter(p=>p.status==='GENERATING').length;
  document.getElementById('pkg-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value">${pkgs.length}</div><div class="stat-label">Total Packages</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${complete}</div><div class="stat-label">Complete</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${gen}</div><div class="stat-label">Generating</div></div>
  `;
  document.getElementById('packages-body').innerHTML=pkgs.length?pkgs.map(p=>`<tr>
    <td style="font-size:11px">#${p.package_id}</td>
    <td style="font-size:12px;font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.package_name||''}</td>
    <td style="font-size:11px">${p.regulation||'ALL'}</td>
    <td style="font-size:11px;white-space:nowrap">${p.period_start||''} – ${p.period_end||''}</td>
    <td style="font-size:11px">${p.generated_by||''}</td>
    <td><span class="badge badge-${(p.status||'').toLowerCase()}">${p.status||''}</span></td>
    <td style="font-size:11px">${fmtBytes(p.file_size_bytes)}</td>
    <td>
      <div class="actions-cell">
        ${p.status==='COMPLETE'?`
          <a href="/api/evidence-packages/${p.package_id}/download/txt" class="btn btn-sm btn-dl">TXT</a>
          <a href="/api/evidence-packages/${p.package_id}/download/zip" class="btn btn-sm btn-dl">CSV</a>
        `:''}
      </div>
    </td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No packages generated yet</td></tr>';

  if(pkgs.some(p=>p.status==='GENERATING')) setTimeout(loadPackages,5000);
}

async function generatePackage(){
  const body={
    regulation:document.getElementById('gen-reg').value||null,
    period_start:document.getElementById('gen-start').value||null,
    period_end:document.getElementById('gen-end').value||null,
    generated_by:document.getElementById('gen-by').value.trim()||'ui-user',
  };
  const res=await fetch('/api/evidence-packages/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast('Package generation started');
  setTimeout(loadPackages,1000);
}

loadPackages();
</script>
</body>
</html>
