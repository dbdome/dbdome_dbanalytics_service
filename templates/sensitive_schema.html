<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sensitive Schema Configuration - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }

  .toolbar {
    background: var(--bg-primary); padding: 8px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .toolbar label { font-size: 12px; color: var(--text-secondary); margin-bottom: 2px; display: block; }
  .toolbar select, .toolbar input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 6px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--blue); outline: none; }
  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-discover { background: var(--orange); color: #fff; }
  .btn-discover:hover { filter: brightness(1.15); }
  .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn-enable { color: var(--green-text); border-color: var(--green-text); }
  .btn-disable { color: var(--red-text); border-color: var(--red-text); }

  .stats-row { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
  .stat-panel {
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 20px; flex: 1; min-width: 140px; text-align: center;
  }
  .stat-value { font-size: 28px; font-weight: 500; line-height: 1.2; }
  .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; margin: 8px 16px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 0; overflow-x: auto; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 10px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }
  .data-table tr.disabled td { opacity: 0.4; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge-pii { background: rgba(209, 14, 92, 0.15); color: var(--red-text); }
  .badge-enabled { background: rgba(26, 127, 75, 0.2); color: var(--green-text); }
  .badge-disabled { background: rgba(100, 100, 100, 0.2); color: var(--text-secondary); }

  .pii-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin: 1px 2px; background: rgba(153, 51, 204, 0.15); color: var(--purple); }

  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--green-text);
    border-radius: 4px; padding: 12px 20px; color: var(--green-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }

  .search-input {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 4px; font-size: 12px; width: 200px;
  }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  .table-scroll { max-height: 65vh; overflow-y: auto; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" style="height:28px" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Sensitive Schema Configuration</div>
</nav>

<div class="toolbar">
  <div>
    <label>Server</label>
    <select id="serverFilter"><option value="all">All Servers</option></select>
  </div>
  <div>
    <label>Database</label>
    <select id="dbFilter"><option value="all">All Databases</option></select>
  </div>
  <div>
    <label>Status</label>
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="sensitive">Sensitive Only</option>
      <option value="enabled">Enabled</option>
      <option value="disabled">Disabled</option>
    </select>
  </div>
  <div>
    <label>Search column</label>
    <input type="text" id="searchInput" class="search-input" placeholder="column name..." />
  </div>
  <div style="align-self: flex-end; display: flex; gap: 8px;">
    <button class="btn btn-discover" id="discoverBtn" onclick="runDiscovery()">Run PII Discovery</button>
    <button class="btn btn-primary" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="stats-row" id="statsBar"></div>

<div class="panel">
  <div class="panel-header">
    <span>Discovered Sensitive Columns</span>
    <div style="display:flex; gap: 8px;">
      <button class="btn-sm btn-enable" onclick="bulkToggle(true)">Enable Selected</button>
      <button class="btn-sm btn-disable" onclick="bulkToggle(false)">Disable Selected</button>
    </div>
  </div>
  <div class="panel-body">
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" /></th>
            <th>Server</th>
            <th>Database</th>
            <th>Table</th>
            <th>Column</th>
            <th>Data Type</th>
            <th>PII Category</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allData = [];

const piiCategories = {
  'ssn': 'SSN', 'social_sec': 'SSN', 'national_id': 'National ID', 'id_number': 'ID', 'id_card': 'ID', 'identity': 'ID', 'passport': 'Passport',
  'credit_card': 'Credit Card', 'card_num': 'Credit Card', 'card_number': 'Credit Card', 'cvv': 'CVV',
  'email': 'Email', 'e_mail': 'Email', 'mail_address': 'Email',
  'phone': 'Phone', 'mobile': 'Phone', 'cell': 'Phone', 'telephone': 'Phone', 'fax': 'Phone',
  'birth_date': 'DOB', 'dob': 'DOB', 'date_of_birth': 'DOB', 'birthday': 'DOB',
  'first_name': 'Name', 'last_name': 'Name', 'full_name': 'Name', 'surname': 'Name', 'family_name': 'Name',
  'address': 'Address', 'street': 'Address', 'city': 'Address', 'zip_code': 'Address', 'postal': 'Address',
  'salary': 'Financial', 'income': 'Financial', 'wage': 'Financial', 'bank_account': 'Financial', 'iban': 'Financial',
  'password': 'Credential', 'pwd': 'Credential', 'secret': 'Credential', 'token': 'Credential',
  'ip_address': 'Network', 'mac_address': 'Network',
  'gender': 'Personal', 'medical': 'Health', 'patient': 'Health', 'diagnosis': 'Health',
  'driver_license': 'License'
};

function classifyColumn(colName) {
  const lower = colName.toLowerCase();
  for (const [pattern, category] of Object.entries(piiCategories)) {
    if (lower.includes(pattern)) return category;
  }
  return null;
}

async function loadData() {
  try {
    const resp = await fetch('/api/sensitive-schema');
    const data = await resp.json();
    allData = data.columns;
    updateStats(data.stats);
    updateFilters(data.servers, data.databases);
    renderTable();
  } catch (e) {
    console.error('Failed to load:', e);
  }
}

function updateStats(s) {
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-emphasis)">${s.total_columns}</div><div class="stat-label">Total Schema Columns</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${s.sensitive_columns}</div><div class="stat-label">Sensitive (PII)</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${s.enabled}</div><div class="stat-label">Enabled for Monitoring</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--text-secondary)">${s.disabled}</div><div class="stat-label">Disabled</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${s.servers}</div><div class="stat-label">Servers</div></div>
  `;
}

function updateFilters(servers, databases) {
  const sf = document.getElementById('serverFilter');
  const cur = sf.value;
  sf.innerHTML = '<option value="all">All Servers</option>' + servers.map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');

  const df = document.getElementById('dbFilter');
  const curDb = df.value;
  df.innerHTML = '<option value="all">All Databases</option>' + databases.map(d => `<option value="${d}" ${d===curDb?'selected':''}>${d}</option>`).join('');
}

function renderTable() {
  const server = document.getElementById('serverFilter').value;
  const db = document.getElementById('dbFilter').value;
  const status = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = allData.filter(r => {
    if (server !== 'all' && r.server !== server) return false;
    if (db !== 'all' && r.database_name !== db) return false;
    if (search && !r.column_name.toLowerCase().includes(search) && !r.table_name.toLowerCase().includes(search)) return false;
    if (status === 'sensitive' && !r.is_sensitive) return false;
    if (status === 'enabled' && !r.is_enabled) return false;
    if (status === 'disabled' && r.is_enabled) return false;
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No columns match the current filters. Run PII Discovery to scan for sensitive columns.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.slice(0, 500).map(r => {
    const cat = classifyColumn(r.column_name);
    const catHtml = cat ? `<span class="pii-tag">${cat}</span>` : '-';
    const statusBadge = r.is_sensitive
      ? `<span class="badge badge-pii">Sensitive</span>`
      : (r.is_enabled ? `<span class="badge badge-enabled">Enabled</span>` : `<span class="badge badge-disabled">Disabled</span>`);
    const btnLabel = r.is_enabled ? 'Disable' : 'Enable';
    const btnClass = r.is_enabled ? 'btn-disable' : 'btn-enable';
    const rowClass = r.is_enabled ? '' : 'disabled';

    return `<tr class="${rowClass}">
      <td><input type="checkbox" class="row-check" data-id="${r.row_id}" data-source="${r.source}" /></td>
      <td>${r.server}</td>
      <td>${r.database_name || '-'}</td>
      <td>${r.table_name}</td>
      <td><b>${r.column_name}</b></td>
      <td>${r.data_type}</td>
      <td>${catHtml}</td>
      <td>${statusBadge}</td>
      <td><button class="btn-sm ${btnClass}" onclick="toggleColumn('${r.source}', ${r.row_id}, ${!r.is_enabled})">${btnLabel}</button></td>
    </tr>`;
  }).join('');

  if (filtered.length > 500) {
    tbody.innerHTML += `<tr><td colspan="9" class="empty-state">Showing 500 of ${filtered.length} rows. Use filters to narrow down.</td></tr>`;
  }
}

async function toggleColumn(source, rowId, enable) {
  try {
    await fetch('/api/sensitive-schema/toggle', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({source, row_id: rowId, is_enabled: enable})
    });
    showToast(enable ? 'Column enabled' : 'Column disabled');
    loadData();
  } catch (e) { showToast('Error: ' + e.message); }
}

async function bulkToggle(enable) {
  const checks = document.querySelectorAll('.row-check:checked');
  if (checks.length === 0) { showToast('No columns selected'); return; }
  const items = Array.from(checks).map(c => ({source: c.dataset.source, row_id: parseInt(c.dataset.id)}));
  try {
    await fetch('/api/sensitive-schema/bulk-toggle', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items, is_enabled: enable})
    });
    showToast(`${items.length} columns ${enable ? 'enabled' : 'disabled'}`);
    loadData();
  } catch (e) { showToast('Error: ' + e.message); }
}

function toggleSelectAll(checkbox) {
  document.querySelectorAll('.row-check').forEach(c => c.checked = checkbox.checked);
}

async function runDiscovery() {
  const btn = document.getElementById('discoverBtn');
  btn.innerHTML = '<span class="spinner"></span> Scanning...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/sensitive-schema/discover', {method: 'POST'});
    const data = await resp.json();
    showToast(data.message);
    loadData();
  } catch (e) { showToast('Discovery failed: ' + e.message); }
  finally { btn.innerHTML = 'Run PII Discovery'; btn.disabled = false; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Filter events
['serverFilter', 'dbFilter', 'statusFilter'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderTable);
});
document.getElementById('searchInput').addEventListener('input', renderTable);

loadData();
</script>
</body>
</html>
