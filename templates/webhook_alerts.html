<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Webhook & Alert Channels - dbdome</title>
<style>
  :root {
    --bg-canvas: #111217; --bg-primary: #181b1f; --bg-secondary: #22252b;
    --border: #343436; --text-primary: rgb(204, 204, 220);
    --text-secondary: rgba(204, 204, 220, 0.65); --text-emphasis: #ffffff;
    --blue: #33a2e5; --blue-base: #3d71d9; --green: #1a7f4b;
    --green-text: #6ccf8e; --red: #d10e5c; --red-text: #ff5286;
    --yellow: #ecbb13; --orange: #eb7b18; --purple: #9933cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, Helvetica, Arial, sans-serif; background: var(--bg-canvas); color: var(--text-primary); }

  .navbar {
    background: var(--bg-primary); height: 52px;
    display: flex; align-items: center; padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .navbar-brand { font-size: 18px; font-weight: 500; color: var(--text-emphasis); display: flex; align-items: center; gap: 8px; }
  .navbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 16px; }
  .navbar-title { font-size: 16px; color: var(--text-primary); }

  .btn { padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; border: none; }
  .btn-primary { background: var(--blue-base); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn-enable { color: var(--green-text); border-color: var(--green-text); }
  .btn-disable { color: var(--red-text); border-color: var(--red-text); }

  .content { display: flex; gap: 8px; padding: 8px 16px; align-items: flex-start; }

  .panel { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 4px; }
  .panel-header {
    padding: 10px 16px; font-size: 14px; font-weight: 500;
    color: var(--text-emphasis); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 0; overflow-x: auto; }

  .left-panel { flex: 0 0 340px; }
  .right-panel { flex: 1; min-width: 0; }

  .form-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .form-group input[type="text"], .form-group select {
    background: var(--bg-secondary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 7px 10px;
    border-radius: 4px; font-size: 13px; font-family: inherit;
  }
  .form-group input[type="text"]:focus, .form-group select:focus { border-color: var(--blue); outline: none; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle-label { font-size: 13px; color: var(--text-primary); }

  .toggle {
    position: relative; display: inline-block; width: 38px; height: 20px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 20px; transition: 0.2s;
  }
  .toggle .slider::before {
    content: ""; position: absolute; height: 14px; width: 14px;
    left: 2px; bottom: 2px; background: var(--text-secondary);
    border-radius: 50%; transition: 0.2s;
  }
  .toggle input:checked + .slider { background: var(--green); border-color: var(--green-text); }
  .toggle input:checked + .slider::before { transform: translateX(18px); background: var(--green-text); }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th {
    padding: 8px 10px; text-align: left; background: var(--bg-secondary);
    color: var(--text-secondary); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border); position: sticky; top: 0;
  }
  .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  .data-table tr:hover td { background: rgba(51, 162, 229, 0.04); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge-on { background: rgba(26, 127, 75, 0.2); color: var(--green-text); }
  .badge-off { background: rgba(100, 100, 100, 0.2); color: var(--text-secondary); }

  .toast {
    position: fixed; top: 60px; right: 20px;
    background: var(--bg-secondary); border: 1px solid var(--green-text);
    border-radius: 4px; padding: 12px 20px; color: var(--green-text);
    font-size: 13px; font-weight: 500; opacity: 0;
    transform: translateX(100px); transition: all 0.3s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(0); }
  .toast.error { border-color: var(--red-text); color: var(--red-text); }

  .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); font-size: 14px; }
  .table-scroll { max-height: 65vh; overflow-y: auto; }

  .form-actions { padding-top: 4px; display: flex; gap: 8px; }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/dbdome" class="navbar-brand" style="text-decoration:none; color:inherit;">
    <img src="/static/images/dbdome_logo.png" alt="dbdome" style="height:28px" />
    dbdome
  </a>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Webhook &amp; Alert Channels</div>
</nav>

<div class="content">
  <!-- Left Panel: Form -->
  <div class="panel left-panel">
    <div class="panel-header"><span>Configure Channel</span></div>
    <div class="form-body">
      <div class="form-group">
        <label>Metric Type</label>
        <input type="text" id="metricType" placeholder="Security, Performance, Health" />
      </div>
      <div class="form-group">
        <div class="toggle-row">
          <span class="toggle-label">Send Mail Alert</span>
          <label class="toggle"><input type="checkbox" id="sendMail" /><span class="slider"></span></label>
        </div>
      </div>
      <div class="form-group">
        <div class="toggle-row">
          <span class="toggle-label">Send SIEM Alert</span>
          <label class="toggle"><input type="checkbox" id="sendSiem" /><span class="slider"></span></label>
        </div>
      </div>
      <div class="form-group">
        <div class="toggle-row">
          <span class="toggle-label">Send Diagnosis Evidence</span>
          <label class="toggle"><input type="checkbox" id="sendDiagnosis" /><span class="slider"></span></label>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="saveChannel()">Save</button>
        <button class="btn" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);" onclick="resetForm()">Clear</button>
      </div>
    </div>
  </div>

  <!-- Right Panel: Table -->
  <div class="panel right-panel">
    <div class="panel-header">
      <span>Configured Channels</span>
      <button class="btn btn-primary" onclick="loadData()" style="padding:3px 12px;font-size:11px;">Refresh</button>
    </div>
    <div class="panel-body">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Metric Type</th>
              <th>Mail</th>
              <th>SIEM</th>
              <th>Diagnosis</th>
              <th style="width:120px;">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allChannels = [];
let editingType = null;

async function loadData() {
  try {
    const resp = await fetch('/api/webhook-alerts');
    const data = await resp.json();
    allChannels = data.channels || [];
    renderTable();
  } catch (e) {
    console.error('Failed to load:', e);
    showToast('Failed to load channels', true);
  }
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  if (allChannels.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No channels configured. Use the form to add one.</td></tr>';
    return;
  }

  tbody.innerHTML = allChannels.map(ch => {
    const mailBadge = ch.mail
      ? '<span class="badge badge-on">ON</span>'
      : '<span class="badge badge-off">OFF</span>';
    const siemBadge = ch.siem
      ? '<span class="badge badge-on">ON</span>'
      : '<span class="badge badge-off">OFF</span>';
    const diagBadge = ch.diagnosis
      ? '<span class="badge badge-on">ON</span>'
      : '<span class="badge badge-off">OFF</span>';

    return `<tr>
      <td><b>${escapeHtml(ch.metric_type)}</b></td>
      <td>${mailBadge}</td>
      <td>${siemBadge}</td>
      <td>${diagBadge}</td>
      <td>
        <button class="btn-sm btn-enable" onclick="editChannel('${escapeAttr(ch.metric_type)}')">Edit</button>
        <button class="btn-sm btn-disable" onclick="deleteChannel('${escapeAttr(ch.metric_type)}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

function editChannel(metricType) {
  const ch = allChannels.find(c => c.metric_type === metricType);
  if (!ch) return;
  editingType = metricType;
  document.getElementById('metricType').value = ch.metric_type;
  document.getElementById('sendMail').checked = !!ch.mail;
  document.getElementById('sendSiem').checked = !!ch.siem;
  document.getElementById('sendDiagnosis').checked = !!ch.diagnosis;
}

function resetForm() {
  editingType = null;
  document.getElementById('metricType').value = '';
  document.getElementById('sendMail').checked = false;
  document.getElementById('sendSiem').checked = false;
  document.getElementById('sendDiagnosis').checked = false;
}

async function saveChannel() {
  const metricType = document.getElementById('metricType').value.trim();
  if (!metricType) { showToast('Metric Type is required', true); return; }

  const payload = {
    metric_type: metricType,
    mail: document.getElementById('sendMail').checked,
    siem: document.getElementById('sendSiem').checked,
    diagnosis: document.getElementById('sendDiagnosis').checked
  };

  try {
    const resp = await fetch('/submit-webhook-alert', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('Server error');
    showToast(editingType ? 'Channel updated' : 'Channel added');
    resetForm();
    loadData();
  } catch (e) {
    showToast('Failed to save: ' + e.message, true);
  }
}

async function deleteChannel(metricType) {
  if (!confirm('Delete channel "' + metricType + '"?')) return;
  try {
    const resp = await fetch('/api/delete-webhook-alert', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({metric_type: metricType})
    });
    if (!resp.ok) throw new Error('Server error');
    showToast('Channel deleted');
    if (editingType === metricType) resetForm();
    loadData();
  } catch (e) {
    showToast('Failed to delete: ' + e.message, true);
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(str) {
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadData();
</script>
</body>
</html>
