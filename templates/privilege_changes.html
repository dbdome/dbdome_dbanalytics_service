<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privilege Changes - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);display:flex;align-items:center;gap:8px;}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-grant{background:#0a1f3a;color:var(--blue);}
  .badge-revoke{background:#3a0010;color:var(--red-text);}
  .badge-yes{background:#0a1f0a;color:var(--green-text);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .filter-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
  .filter-bar select{background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);padding:5px 10px;border-radius:4px;font-size:12px;font-family:inherit;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Privilege Changes</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('log')">Change Log</div>
  <div class="tab" onclick="switchTab('recent')">Recent Grants</div>
</div>

<div class="tab-content active" id="tab-log">
  <div class="stats-row" id="priv-stats"></div>
  <div class="filter-bar">
    <select id="f-op" onchange="loadLog()">
      <option value="">All Operations</option>
      <option>GRANT</option><option>REVOKE</option>
    </select>
    <select id="f-reg" onchange="loadLog()">
      <option value="">All Regulations</option>
      <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option>
    </select>
    <button class="btn-sm" onclick="loadLog()">Refresh</button>
  </div>
  <div class="panel">
    <div class="panel-header"><span>Privilege Change Events (last 500)</span></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Time</th><th>Server</th><th>Operation</th><th>Grantor</th>
          <th>Grantee</th><th>Privilege</th><th>Object</th><th>Admin Option</th><th>Regulation</th>
        </tr></thead>
        <tbody id="log-body"><tr><td colspan="9" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-recent">
  <div class="panel">
    <div class="panel-header"><span>Recent Privilege Grants (7 days)</span><button class="btn-sm" onclick="loadRecent()">Refresh</button></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Server</th><th>Grantee</th><th>Privilege Count</th><th>Admin Option Grants</th><th>Last Event</th>
        </tr></thead>
        <tbody id="recent-body"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['log','recent'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='log') loadLog();
  if(name==='recent') loadRecent();
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,19); }

async function loadLog(){
  const op=document.getElementById('f-op').value;
  const reg=document.getElementById('f-reg').value;
  const params=new URLSearchParams();
  if(op) params.set('operation',op);
  if(reg) params.set('regulation',reg);
  const res=await fetch('/api/privilege-changes?'+params);
  const data=await res.json();
  const rows=data.rows||[];
  const grants=rows.filter(r=>r.operation==='GRANT').length;
  const revokes=rows.filter(r=>r.operation==='REVOKE').length;
  const admin=rows.filter(r=>r.with_grant).length;
  document.getElementById('priv-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${grants}</div><div class="stat-label">Grants</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${revokes}</div><div class="stat-label">Revokes</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--orange)">${admin}</div><div class="stat-label">Admin Option</div></div>
    <div class="stat-panel"><div class="stat-value">${rows.length}</div><div class="stat-label">Total</div></div>
  `;
  document.getElementById('log-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="white-space:nowrap;font-size:11px">${fmtTs(r.event_time)}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td><span class="badge badge-${(r.operation||'').toLowerCase()}">${r.operation||''}</span></td>
    <td style="font-size:11px">${r.grantor_user||''}</td>
    <td style="font-size:11px;font-weight:500">${r.grantee_user||''}</td>
    <td style="font-size:11px">${r.privilege_type||''}</td>
    <td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.object_name||''}</td>
    <td style="text-align:center">${r.with_grant?'<span class="badge badge-yes">YES</span>':''}</td>
    <td style="font-size:11px">${r.regulation||''}</td>
  </tr>`).join(''):'<tr><td colspan="9" class="empty">No privilege changes found</td></tr>';
}

async function loadRecent(){
  const res=await fetch('/api/privilege-changes/recent-summary');
  const data=await res.json();
  const rows=data.rows||[];
  document.getElementById('recent-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="font-weight:500">${r.grantee_user||''}</td>
    <td style="text-align:center">${r.grant_count||0}</td>
    <td style="text-align:center;color:var(--orange)">${r.admin_option_count||0}</td>
    <td style="font-size:11px">${fmtTs(r.last_event)}</td>
  </tr>`).join(''):'<tr><td colspan="5" class="empty">No data</td></tr>';
}

loadLog();
</script>
</body>
</html>
