<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Servers</title>
<link rel="stylesheet" href="../static/css/processform_style.css" />
<style>
  .process-success { display: none; margin-top: 1rem; color: green; font-weight: bold; }
  .process-sparkle { position: absolute; width: 6px; height: 6px; border-radius: 50%; opacity: 0; animation: sparkle 0.5s ease-out forwards; }
  .cyan { background-color: cyan; }
  .white { background-color: white; }
  @keyframes sparkle { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">dbdome</div>
</header>

<main class="form-shell">
  <div class="process-sparkles" id="processSparkles"></div>

  <form class="processes-form" id="serverForm" action="/submit-serverform" method="POST">
    <h1 class="form-title">Servers</h1>

    <div class="field-group">      
      <select id="Add_Delete_Modify" name="add_delete_modify" required>      
        <option value="add">Add</option>
        <option value="delete">Delete</option>
        <option value="modify">Modify</option>
    </select>
    </div>


    <div class="input-field">
        <label>IP Address</label>         
          <input type="text" name="ipAddress" required>
    </div>

    
    <div class="input-field">
        <label>serverName</label>         
              <input type="text" name="serverName" required>
           
    </div>

    
    <div class="input-field">
        <label for="port">Port</label>
          <input type="number" id="port" name="port" required>    
    </div>
    <div class="field-group">
          <label for="dbVendor">Database Vendor</label>
          <select id="dbVendor" name="dbVendor" required>
            <option value="">Select</option>
            <option value="MSSQL">Microsoft SQL Server</option>
            <option value="MySQL">MySQL</option>
            <option value="PostgreSQL">PostgreSQL</option>
            <option value="Oracle">Oracle</option>
          </select>
    </div>
    <div class="input-field">
        <label for="dbVersion">Database Version</label>
          <input type="text" id="dbVersion" name="dbVersion">
    </div>
    <div class="field-group">
         
          <label for="authType">Authentication Type</label> <select id="authType" name="authType" onchange="toggleAuthFields()" required>
            <option value="">Select</option>
            <option value="sql">SQL Authentication</option>
            <option value="windows">Windows Authentication</option>
          </select>
    </div>
        
          <div id="sqlAuthFields" style="display: none;">
            <label for="user">User</label>
            <input type="text" id="user" name="user">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
          </div>

    

          <script>
            function toggleAuthFields() {
                const authType = document.getElementById("authType").value;
                const sqlAuthFields = document.getElementById("sqlAuthFields");

                if (authType === "sql") {
                    sqlAuthFields.style.display = "block";
                    document.getElementById("user").required = true;
                    document.getElementById("password").required = true;
                } else {
                    sqlAuthFields.style.display = "none";
                    document.getElementById("user").required = false;
                    document.getElementById("password").required = false;
                }
            }
</script>

    <button type="submit" class="primary-btn" id="deployBtn">Submit</button>
  </form>

  <div class="process-success" id="processSuccess" aria-live="polite">
    The process has been successfully sent
  </div>
</main>

<script>
const processesForm = document.getElementById("processesForm");
const sparklesContainer = document.getElementById("processSparkles");
const successPopup = document.getElementById("processSuccess");
const deployBtn = document.getElementById("deployBtn");

// Function to create sparkles
function createSparkle(x, y, color, delay) {
  const sparkle = document.createElement("div");
  sparkle.className = `process-sparkle ${color}`;
  sparkle.style.left = `${x}%`;
  sparkle.style.top = `${y}%`;
  sparkle.style.animationDelay = `${delay}s`;
  sparklesContainer.appendChild(sparkle);

  setTimeout(() => {
    if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
  }, 500);
}

function emitSparkles() {
  const rect = processesForm.getBoundingClientRect();
  const centerX = ((rect.left + rect.width / 2) / window.innerWidth) * 100;
  const centerY = ((rect.top + rect.height / 2) / window.innerHeight) * 100;

  const count = 35;
  for (let i = 0; i < count; i++) {
    const offsetX = (Math.random() - 0.5) * 20;
    const offsetY = (Math.random() - 0.5) * 10;
    const x = centerX + offsetX;
    const y = centerY + offsetY;
    const color = Math.random() > 0.5 ? "cyan" : "white";
    const delay = Math.random() * 0.3;
    createSparkle(x, y, color, delay);
  }
}

// Disable button temporarily
processesForm.addEventListener("submit", () => {
  deployBtn.disabled = true;
  setTimeout(() => { deployBtn.disabled = false; }, 1500);
});

// Show success popup if query parameter success=1
window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("success") === "1") {
    emitSparkles();
    successPopup.style.display = "block";
    setTimeout(() => { successPopup.style.display = "none"; }, 3000);
  }
});
</script>
</body>
</html>
