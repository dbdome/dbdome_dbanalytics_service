<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firewall Audit Log - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);display:flex;align-items:center;gap:8px;}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .toolbar{background:var(--bg-primary);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .toolbar label{font-size:12px;color:var(--text-secondary);margin-bottom:2px;display:block;}
  .toolbar select,.toolbar input[type=text],.toolbar input[type=datetime-local]{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .toolbar select:focus,.toolbar input:focus{border-color:var(--blue);outline:none;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;} .btn-primary:hover{filter:brightness(1.15);}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:120px;text-align:center;}
  .stat-value{font-size:26px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin:8px 16px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-block{background:#3a0a1a;color:var(--red-text);}
  .badge-alert{background:#3a2a00;color:var(--yellow);}
  .badge-allow{background:#0a1f0a;color:var(--green-text);}
  .badge-mask{background:#1a0a3a;color:var(--purple);}
  .badge-alerted{background:#2a1f00;color:var(--yellow);}
  .sql-cell{max-width:320px;font-family:monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--text-secondary);}
  .sql-cell:hover{color:var(--text-primary);}
  .pager{display:flex;align-items:center;gap:8px;padding:12px 16px;justify-content:flex-end;border-top:1px solid var(--border);}
  .pager-info{font-size:12px;color:var(--text-secondary);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .risk-high{color:var(--red-text);}
  .risk-med{color:var(--yellow);}
  .risk-low{color:var(--green-text);}
  .filter-group{display:flex;flex-direction:column;}
  .sql-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;align-items:center;justify-content:center;}
  .sql-modal.open{display:flex;}
  .sql-modal-box{background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:20px;max-width:640px;width:90%;max-height:80vh;overflow:auto;}
  .sql-modal-box h3{font-size:14px;margin-bottom:12px;color:var(--text-emphasis);}
  .sql-modal-box pre{font-size:12px;color:var(--text-primary);white-space:pre-wrap;word-break:break-all;background:var(--bg-canvas);padding:12px;border-radius:4px;border:1px solid var(--border);}
  .sql-modal-box button{margin-top:12px;float:right;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Firewall Audit Log</div>
</div>

<div class="toolbar">
  <div class="filter-group">
    <label>Action</label>
    <select id="filter-action" onchange="load()">
      <option value="">All</option>
      <option>BLOCK</option><option>ALERT</option><option>ALLOW</option><option>MASK</option><option>ALERTED</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Server</label>
    <input type="text" id="filter-server" placeholder="server name" style="width:160px" onchange="load()">
  </div>
  <div class="filter-group">
    <label>DB User</label>
    <input type="text" id="filter-user" placeholder="login name" style="width:130px" onchange="load()">
  </div>
  <div class="filter-group">
    <label>From</label>
    <input type="datetime-local" id="filter-from" onchange="load()">
  </div>
  <div class="filter-group">
    <label>To</label>
    <input type="datetime-local" id="filter-to" onchange="load()">
  </div>
  <button class="btn btn-primary" style="margin-top:18px" onclick="load()">Refresh</button>
</div>

<div class="stats-row" id="stats-row"></div>

<div class="panel">
  <div class="panel-header">
    <span>Audit Events</span>
    <span id="event-count" style="font-size:12px;color:var(--text-secondary)"></span>
  </div>
  <div class="panel-body">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Server</th>
          <th>DB User</th>
          <th>Client IP</th>
          <th>Action</th>
          <th>Risk</th>
          <th>Regulation</th>
          <th>Policy</th>
          <th>SQL Statement</th>
        </tr>
      </thead>
      <tbody id="log-body">
        <tr><td colspan="9" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</div>

<div class="sql-modal" id="sql-modal" onclick="closeSql(event)">
  <div class="sql-modal-box">
    <h3>SQL Statement</h3>
    <pre id="sql-content"></pre>
    <button class="btn btn-sm" onclick="document.getElementById('sql-modal').classList.remove('open')">Close</button>
  </div>
</div>

<script>
let page = 1;
const PAGE_SIZE = 50;
let totalRows = 0;

function actionBadge(a){
  const m={BLOCK:'badge-block',ALERT:'badge-alert',ALLOW:'badge-allow',MASK:'badge-mask',ALERTED:'badge-alerted'};
  return `<span class="badge ${m[a]||''}">${a}</span>`;
}
function riskColor(score){
  if(score>=70) return 'risk-high';
  if(score>=40) return 'risk-med';
  return 'risk-low';
}
function fmtTs(ts){ return ts ? ts.replace('T',' ').substring(0,19) : ''; }

async function load(resetPage=true){
  if(resetPage) page = 1;
  const params = new URLSearchParams({page, page_size: PAGE_SIZE});
  const action = document.getElementById('filter-action').value;
  const server = document.getElementById('filter-server').value;
  const user   = document.getElementById('filter-user').value;
  const from   = document.getElementById('filter-from').value;
  const to     = document.getElementById('filter-to').value;
  if(action) params.set('action', action);
  if(server) params.set('server_name', server);
  if(user)   params.set('db_user', user);
  if(from)   params.set('from_dt', from);
  if(to)     params.set('to_dt', to);

  const res  = await fetch('/api/audit-log?' + params);
  const data = await res.json();
  const rows = data.rows || [];
  totalRows  = data.total || rows.length;

  const counts = {BLOCK:0,ALERT:0,ALLOW:0,MASK:0};
  rows.forEach(r => { if(counts[r.action_taken]!==undefined) counts[r.action_taken]++; });
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${counts.BLOCK}</div><div class="stat-label">BLOCK (page)</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${counts.ALERT}</div><div class="stat-label">ALERT (page)</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--green-text)">${counts.ALLOW}</div><div class="stat-label">ALLOW (page)</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--purple)">${counts.MASK}</div><div class="stat-label">MASK (page)</div></div>
    <div class="stat-panel"><div class="stat-value">${totalRows}</div><div class="stat-label">Total matching</div></div>
  `;
  document.getElementById('event-count').textContent = `${totalRows} events`;

  const tbody = document.getElementById('log-body');
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No events found</td></tr>';
    document.getElementById('pager').innerHTML = '';
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td style="white-space:nowrap;font-size:11px">${fmtTs(r.event_time)}</td>
      <td>${r.server_name||''}</td>
      <td>${r.db_user||''}</td>
      <td style="font-family:monospace;font-size:11px">${r.client_ip||''}</td>
      <td>${actionBadge(r.action_taken)}</td>
      <td class="${riskColor(r.risk_score)}" style="font-weight:500">${r.risk_score||0}</td>
      <td>${r.regulation||''}</td>
      <td style="font-size:11px">${r.policy_name||''}</td>
      <td class="sql-cell" onclick="showSql('${(r.sql_statement||'').replace(/'/g,"\\'").replace(/\n/g,' ')}')">${(r.sql_statement||'').substring(0,80)}</td>
    </tr>
  `).join('');

  const totalPages = Math.ceil(totalRows / PAGE_SIZE);
  document.getElementById('pager').innerHTML = `
    <span class="pager-info">Page ${page} of ${totalPages} (${totalRows} rows)</span>
    <button class="btn btn-sm" onclick="prevPage()" ${page<=1?'disabled':''}>&#8249; Prev</button>
    <button class="btn btn-sm" onclick="nextPage()" ${page>=totalPages?'disabled':''}>Next &#8250;</button>
  `;
}

function prevPage(){ if(page>1){page--;load(false);} }
function nextPage(){ page++;load(false); }

function showSql(sql){
  document.getElementById('sql-content').textContent = sql;
  document.getElementById('sql-modal').classList.add('open');
}
function closeSql(e){
  if(e.target === document.getElementById('sql-modal'))
    document.getElementById('sql-modal').classList.remove('open');
}

// Default to last 24h
const now = new Date();
const ago = new Date(now - 86400000);
document.getElementById('filter-to').value   = now.toISOString().slice(0,16);
document.getElementById('filter-from').value = ago.toISOString().slice(0,16);

load();
</script>
</body>
</html>
