<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TLS Enforcement - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  .form-panel-body{padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-high{background:#3a1a00;color:var(--orange);}
  .badge-medium{background:#2a2000;color:var(--yellow);}
  .badge-required{background:#0a1f3a;color:var(--blue);}
  .badge-optional{background:#2a2a2a;color:var(--text-secondary);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .layout-2col{display:flex;gap:12px;align-items:flex-start;}
  .col-form{width:360px;flex-shrink:0;}
  .col-table{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  .text-mono{font-family:monospace;font-size:11px;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">TLS / Encryption Enforcement</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('violations')">TLS Violations</div>
  <div class="tab" onclick="switchTab('policies')">Enforcement Policies</div>
</div>

<div class="tab-content active" id="tab-violations">
  <div class="stats-row" id="tls-stats"></div>
  <div class="panel">
    <div class="panel-header"><span>Unencrypted Connection Violations (last 24h)</span>
      <button class="btn-sm" onclick="loadViolations()">Refresh</button></div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Detected</th><th>Server</th><th>DB User</th><th>Client IP</th>
          <th>SSL Mode</th><th>Risk</th><th>Regulation</th><th>Action</th>
        </tr></thead>
        <tbody id="violations-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-policies">
  <div class="layout-2col">
    <div class="col-form">
      <div class="panel">
        <div class="panel-header"><span id="pol-form-title">New Policy</span>
          <button class="btn-sm" onclick="resetForm()">Reset</button></div>
        <div class="form-panel-body">
          <input type="hidden" id="pf-id">
          <div class="form-group"><label>Server Name *</label><input id="pf-server"></div>
          <div class="form-row">
            <div class="form-group"><label>Require SSL</label>
              <select id="pf-ssl"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Action</label>
              <select id="pf-action"><option>ALERT</option><option>BLOCK</option><option>LOG</option></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Min TLS Version</label>
              <select id="pf-tls">
                <option value="">Any</option><option>TLSv1.2</option><option>TLSv1.3</option>
              </select></div>
            <div class="form-group"><label>Regulation</label>
              <select id="pf-reg">
                <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option>
              </select></div>
          </div>
          <button class="btn btn-primary" onclick="savePolicy()" style="width:100%">Save Policy</button>
        </div>
      </div>
    </div>
    <div class="col-table">
      <div class="panel">
        <div class="panel-header"><span>TLS Enforcement Policies</span></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Server</th><th>Require SSL</th><th>Min TLS</th><th>Action</th><th>Regulation</th><th>Actions</th></tr></thead>
            <tbody id="policies-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let policies=[];
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['violations','policies'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='violations') loadViolations();
  if(name==='policies') loadPolicies();
}
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',3500);
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,19); }

async function loadViolations(){
  const res=await fetch('/api/tls/violations');
  const data=await res.json();
  const rows=data.rows||[];
  const servers=new Set(rows.map(r=>r.server_name)).size;
  document.getElementById('tls-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${rows.length}</div><div class="stat-label">Violations (24h)</div></div>
    <div class="stat-panel"><div class="stat-value">${servers}</div><div class="stat-label">Affected Servers</div></div>
  `;
  document.getElementById('violations-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-size:11px;white-space:nowrap">${fmtTs(r.detected_at)}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="font-size:11px">${r.db_user||''}</td>
    <td class="text-mono">${r.client_ip||''}</td>
    <td class="text-mono" style="color:var(--red-text)">${r.ssl_mode||'none'}</td>
    <td><span class="badge badge-high">HIGH</span></td>
    <td style="font-size:11px">${r.regulation||''}</td>
    <td style="font-size:11px">${r.action_taken||''}</td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No TLS violations in last 24h</td></tr>';
}

async function loadPolicies(){
  const res=await fetch('/api/tls/policies');
  const data=await res.json();
  policies=data.policies||[];
  document.getElementById('policies-body').innerHTML=policies.length?policies.map(p=>`<tr>
    <td style="font-weight:500">${p.server_name||''}</td>
    <td><span class="badge badge-${p.require_ssl?'required':'optional'}">${p.require_ssl?'Required':'Optional'}</span></td>
    <td style="font-size:11px;font-family:monospace">${p.min_tls_version||'Any'}</td>
    <td style="font-size:11px">${p.action||''}</td>
    <td style="font-size:11px">${p.regulation||''}</td>
    <td><button class="btn btn-sm" onclick="editPolicy(${p.tls_policy_id})">Edit</button></td>
  </tr>`).join(''):'<tr><td colspan="6" class="empty">No policies defined</td></tr>';
}

function resetForm(){
  document.getElementById('pol-form-title').textContent='New Policy';
  document.getElementById('pf-id').value='';
  document.getElementById('pf-server').value='';
  document.getElementById('pf-ssl').value='true';
  document.getElementById('pf-action').value='ALERT';
  document.getElementById('pf-tls').value='';
  document.getElementById('pf-reg').value='PCI-DSS';
}

function editPolicy(id){
  const p=policies.find(x=>x.tls_policy_id===id); if(!p) return;
  document.getElementById('pol-form-title').textContent='Edit Policy';
  document.getElementById('pf-id').value=id;
  document.getElementById('pf-server').value=p.server_name||'';
  document.getElementById('pf-ssl').value=String(p.require_ssl);
  document.getElementById('pf-action').value=p.action||'ALERT';
  document.getElementById('pf-tls').value=p.min_tls_version||'';
  document.getElementById('pf-reg').value=p.regulation||'PCI-DSS';
}

async function savePolicy(){
  const id=document.getElementById('pf-id').value;
  const body={
    server_name:document.getElementById('pf-server').value.trim(),
    require_ssl:document.getElementById('pf-ssl').value==='true',
    action:document.getElementById('pf-action').value,
    min_tls_version:document.getElementById('pf-tls').value||null,
    regulation:document.getElementById('pf-reg').value,
  };
  if(!body.server_name){showToast('Server name required',true);return;}
  const url=id?`/api/tls/policies/${id}`:'/api/tls/policies';
  const res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast(id?'Policy updated':'Policy created'); resetForm(); loadPolicies();
}

loadViolations();
</script>
</body>
</html>
