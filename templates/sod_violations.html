<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoD Violations - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .tabs{background:var(--bg-primary);display:flex;border-bottom:1px solid var(--border);padding:0 16px;}
  .tab{padding:12px 18px;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab:hover{color:var(--text-primary);}
  .tab-content{display:none;padding:12px 16px;}
  .tab-content.active{display:block;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .btn-ack{color:var(--yellow);border-color:var(--yellow);}
  .stats-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-value{font-size:24px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:0;overflow-x:auto;}
  .form-panel-body{padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-critical{background:#3a0010;color:#ff3a6e;}
  .badge-high{background:#3a1a00;color:var(--orange);}
  .badge-medium{background:#2a2000;color:var(--yellow);}
  .badge-low{background:#0a1f0a;color:var(--green-text);}
  .badge-open{background:#3a0010;color:var(--red-text);}
  .badge-ack{background:#2a1a00;color:var(--yellow);}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .layout-2col{display:flex;gap:12px;align-items:flex-start;}
  .col-form{width:340px;flex-shrink:0;}
  .col-table{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .form-row .form-group{flex:1;}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Segregation of Duties Violations</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('violations')">Active Violations</div>
  <div class="tab" onclick="switchTab('rules')">SoD Rules</div>
</div>

<div class="tab-content active" id="tab-violations">
  <div class="stats-row" id="sod-stats"></div>
  <div class="panel">
    <div class="panel-header">
      <span>Open SoD Violations</span>
      <button class="btn-sm" onclick="loadViolations()">Refresh</button>
    </div>
    <div class="panel-body">
      <table>
        <thead><tr>
          <th>Detected</th><th>Server</th><th>DB User</th><th>Rule</th>
          <th>Severity</th><th>Regulation</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody id="violations-body"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-rules">
  <div class="layout-2col">
    <div class="col-form">
      <div class="panel">
        <div class="panel-header"><span id="rule-form-title">New SoD Rule</span>
          <button class="btn-sm" onclick="resetRuleForm()">Reset</button></div>
        <div class="form-panel-body">
          <input type="hidden" id="rf-id">
          <div class="form-group"><label>Rule Name *</label><input id="rf-name"></div>
          <div class="form-group"><label>Description</label><textarea id="rf-desc" style="min-height:60px"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label>Severity</label>
              <select id="rf-severity">
                <option>LOW</option><option>MEDIUM</option><option selected>HIGH</option><option>CRITICAL</option>
              </select></div>
            <div class="form-group"><label>Regulation</label>
              <select id="rf-regulation">
                <option value="">None</option><option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option>
              </select></div>
          </div>
          <div class="form-group"><label>Role A Pattern (comma-separated)</label>
            <input id="rf-role-a" placeholder="DBA,sysadmin"></div>
          <div class="form-group"><label>Role B Pattern (comma-separated)</label>
            <input id="rf-role-b" placeholder="auditor,compliance"></div>
          <button class="btn btn-primary" onclick="saveRule()" style="width:100%">Save Rule</button>
        </div>
      </div>
    </div>
    <div class="col-table">
      <div class="panel">
        <div class="panel-header"><span>SoD Rules</span></div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Rule Name</th><th>Severity</th><th>Regulation</th><th>Active</th><th>Actions</th></tr></thead>
            <tbody id="rules-body"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let rules=[];
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['violations','rules'][i]===name);
  });
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='violations') loadViolations();
  if(name==='rules') loadRules();
}
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'');t.style.display='block';setTimeout(()=>t.style.display='none',3500);
}
function sevBadge(s){
  const m={CRITICAL:'badge-critical',HIGH:'badge-high',MEDIUM:'badge-medium',LOW:'badge-low'};
  return `<span class="badge ${m[s]||''}">${s||''}</span>`;
}
function fmtTs(ts){ return (ts||'').replace('T',' ').substring(0,19); }

async function loadViolations(){
  const res=await fetch('/api/sod/violations');
  const data=await res.json();
  const rows=data.rows||[];
  const open=rows.filter(r=>!r.is_acknowledged).length;
  const crit=rows.filter(r=>r.severity==='CRITICAL').length;
  document.getElementById('sod-stats').innerHTML=`
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${open}</div><div class="stat-label">Unacknowledged</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${crit}</div><div class="stat-label">Critical</div></div>
    <div class="stat-panel"><div class="stat-value">${rows.length}</div><div class="stat-label">Total (30d)</div></div>
  `;
  document.getElementById('violations-body').innerHTML=rows.length?rows.map(r=>`<tr>
    <td style="font-size:11px;white-space:nowrap">${fmtTs(r.detected_at)}</td>
    <td style="font-size:11px">${r.server_name||''}</td>
    <td style="font-weight:500;font-size:12px">${r.db_user||''}</td>
    <td style="font-size:11px">${r.rule_name||''}</td>
    <td>${sevBadge(r.severity)}</td>
    <td style="font-size:11px">${r.regulation||''}</td>
    <td>${r.is_acknowledged?'<span class="badge badge-ack">ACK</span>':'<span class="badge badge-open">OPEN</span>'}</td>
    <td>${!r.is_acknowledged?`<button class="btn btn-sm btn-ack" onclick="acknowledge(${r.violation_id})">Acknowledge</button>`:''}</td>
  </tr>`).join(''):'<tr><td colspan="8" class="empty">No active violations</td></tr>';
}

async function acknowledge(id){
  const res=await fetch(`/api/sod/violations/${id}/acknowledge`,{method:'POST'});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast('Violation acknowledged'); loadViolations();
}

async function loadRules(){
  const res=await fetch('/api/sod/rules');
  const data=await res.json();
  rules=data.rules||[];
  document.getElementById('rules-body').innerHTML=rules.length?rules.map(r=>`<tr>
    <td style="font-weight:500">${r.rule_name||''}</td>
    <td>${sevBadge(r.severity)}</td>
    <td style="font-size:11px">${r.regulation||''}</td>
    <td>${r.is_active?'<span style="color:var(--green-text)">●</span>':'<span style="color:var(--text-secondary)">●</span>'}</td>
    <td><button class="btn btn-sm" onclick="editRule(${r.rule_id})">Edit</button></td>
  </tr>`).join(''):'<tr><td colspan="5" class="empty">No rules defined</td></tr>';
}

function resetRuleForm(){
  document.getElementById('rule-form-title').textContent='New SoD Rule';
  document.getElementById('rf-id').value='';
  ['rf-name','rf-role-a','rf-role-b','rf-desc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rf-severity').value='HIGH';
  document.getElementById('rf-regulation').value='';
}

function editRule(id){
  const r=rules.find(x=>x.rule_id===id); if(!r) return;
  document.getElementById('rule-form-title').textContent='Edit Rule';
  document.getElementById('rf-id').value=id;
  document.getElementById('rf-name').value=r.rule_name||'';
  document.getElementById('rf-desc').value=r.description||'';
  document.getElementById('rf-severity').value=r.severity||'HIGH';
  document.getElementById('rf-regulation').value=r.regulation||'';
  document.getElementById('rf-role-a').value=(r.role_a_patterns||[]).join(',');
  document.getElementById('rf-role-b').value=(r.role_b_patterns||[]).join(',');
}

async function saveRule(){
  const id=document.getElementById('rf-id').value;
  const body={
    rule_name:document.getElementById('rf-name').value.trim(),
    description:document.getElementById('rf-desc').value.trim()||null,
    severity:document.getElementById('rf-severity').value,
    regulation:document.getElementById('rf-regulation').value||null,
    role_a_patterns:document.getElementById('rf-role-a').value.split(',').map(s=>s.trim()).filter(Boolean),
    role_b_patterns:document.getElementById('rf-role-b').value.split(',').map(s=>s.trim()).filter(Boolean),
  };
  if(!body.rule_name){showToast('Rule name required',true);return;}
  const url=id?`/api/sod/rules/${id}`:'/api/sod/rules';
  const res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok){showToast(data.detail||'Error',true);return;}
  showToast(id?'Rule updated':'Rule created'); resetRuleForm(); loadRules();
}

loadViolations();
</script>
</body>
</html>
