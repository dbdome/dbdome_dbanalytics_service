<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masking Rules - dbdome GRC</title>
<style>
  :root {
    --bg-canvas:#111217; --bg-primary:#181b1f; --bg-secondary:#22252b;
    --border:#343436; --text-primary:rgb(204,204,220);
    --text-secondary:rgba(204,204,220,0.65); --text-emphasis:#ffffff;
    --blue:#33a2e5; --blue-base:#3d71d9; --green:#1a7f4b;
    --green-text:#6ccf8e; --red:#d10e5c; --red-text:#ff5286;
    --yellow:#ecbb13; --orange:#eb7b18; --purple:#9933cc;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg-canvas);color:var(--text-primary);}
  .navbar{background:var(--bg-primary);height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);}
  .navbar-brand{font-size:18px;font-weight:500;color:var(--text-emphasis);display:flex;align-items:center;gap:8px;}
  .navbar-sep{width:1px;height:24px;background:var(--border);margin:0 16px;}
  .navbar-title{font-size:16px;color:var(--text-primary);}
  .toolbar{background:var(--bg-primary);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .toolbar label{font-size:12px;color:var(--text-secondary);margin-bottom:2px;display:block;}
  .toolbar select,.toolbar input{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .toolbar select:focus,.toolbar input:focus{border-color:var(--blue);outline:none;}
  .btn{padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;border:none;}
  .btn-primary{background:var(--blue-base);color:#fff;} .btn-primary:hover{filter:brightness(1.15);}
  .btn-orange{background:var(--orange);color:#fff;} .btn-orange:hover{filter:brightness(1.15);}
  .btn-sm{background:transparent;border:1px solid var(--border);color:var(--text-primary);padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px;}
  .btn-edit{color:var(--blue);border-color:var(--blue);}
  .btn-enable{color:var(--green-text);border-color:var(--green-text);}
  .btn-disable{color:var(--yellow);border-color:var(--yellow);}
  .stats-row{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;}
  .stat-panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;padding:14px 20px;flex:1;min-width:120px;text-align:center;}
  .stat-value{font-size:26px;font-weight:500;line-height:1.2;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .content-row{display:flex;gap:8px;padding:0 16px;margin-top:8px;align-items:flex-start;}
  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:4px;}
  .panel-header{padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-emphasis);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:16px;overflow-x:auto;}
  .form-panel{width:300px;flex-shrink:0;}
  .table-panel{flex:1;min-width:0;}
  .form-group{margin-bottom:12px;}
  .form-group label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block;}
  .form-group input,.form-group select{width:100%;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit;}
  .form-group input:focus,.form-group select:focus{border-color:var(--blue);outline:none;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:var(--bg-secondary);}
  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:500;}
  .badge-redact{background:#3a0a1a;color:var(--red-text);}
  .badge-partial{background:#3a2a00;color:var(--yellow);}
  .badge-hash{background:#0a1a3a;color:var(--blue);}
  .badge-tokenize{background:#1a0a3a;color:var(--purple);}
  .badge-active{background:#0a1f0a;color:var(--green-text);}
  .badge-inactive{background:#2a2a2a;color:var(--text-secondary);}
  .pii-ssn{color:var(--red-text);}
  .pii-cc{color:var(--orange);}
  .pii-email{color:var(--blue);}
  .pii-name{color:var(--green-text);}
  .pii-generic{color:var(--text-secondary);}
  .actions-cell{display:flex;gap:4px;}
  .empty{text-align:center;padding:40px;color:var(--text-secondary);}
  .toast{position:fixed;bottom:24px;right:24px;background:#1f6b33;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;display:none;z-index:9999;}
  .toast.err{background:#7a0a25;}
  .filter-group{display:flex;flex-direction:column;}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-brand">&#x1F6E1; DBDOME GRC</div>
  <div class="navbar-sep"></div>
  <div class="navbar-title">Data Masking Rules</div>
</div>

<div class="toolbar">
  <div class="filter-group">
    <label>PII Type</label>
    <select id="filter-pii" onchange="load()">
      <option value="">All</option>
      <option>SSN</option><option>CREDIT_CARD</option><option>EMAIL</option><option>PHONE</option>
      <option>DOB</option><option>NAME</option><option>ADDRESS</option><option>SALARY</option>
      <option>PASSWORD</option><option>MEDICAL</option><option>GENERIC</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Mask Type</label>
    <select id="filter-mask" onchange="load()">
      <option value="">All</option>
      <option>REDACT</option><option>PARTIAL</option><option>HASH</option><option>TOKENIZE</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Status</label>
    <select id="filter-active" onchange="load()">
      <option value="">All</option>
      <option value="true">Active</option><option value="false">Inactive</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Server</label>
    <input type="text" id="filter-server" placeholder="server name" style="width:150px" onchange="load()">
  </div>
  <button class="btn btn-orange" style="margin-top:18px" onclick="syncRules()">&#8635; Sync from Discovery</button>
  <button class="btn btn-primary" style="margin-top:18px" onclick="newRule()">+ Add Rule</button>
</div>

<div class="stats-row" id="stats-row"></div>

<div class="content-row">
  <div class="panel form-panel" id="form-panel">
    <div class="panel-header">
      <span id="form-title">New Rule</span>
      <button class="btn btn-sm" onclick="cancelForm()">Cancel</button>
    </div>
    <div class="panel-body">
      <input type="hidden" id="f-rule-id" value="">
      <div class="form-group">
        <label>Server Name *</label>
        <input id="f-server" placeholder="prod-sqlserver-01">
      </div>
      <div class="form-group">
        <label>Table Name *</label>
        <input id="f-table" placeholder="customers">
      </div>
      <div class="form-group">
        <label>Column Name *</label>
        <input id="f-column" placeholder="credit_card_number">
      </div>
      <div class="form-group">
        <label>PII Type</label>
        <select id="f-pii">
          <option>GENERIC</option><option>SSN</option><option>CREDIT_CARD</option>
          <option>EMAIL</option><option>PHONE</option><option>DOB</option><option>NAME</option>
          <option>ADDRESS</option><option>SALARY</option><option>PASSWORD</option><option>MEDICAL</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mask Type</label>
        <select id="f-mask">
          <option>HASH</option><option>REDACT</option><option>PARTIAL</option><option>TOKENIZE</option>
        </select>
      </div>
      <div class="form-group">
        <label>Regulation</label>
        <select id="f-regulation">
          <option value="">None</option>
          <option>PCI-DSS</option><option>HIPAA</option><option>GDPR</option><option>SOC2</option><option>internal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Allowed Roles (comma-separated, bypass masking)</label>
        <input id="f-roles" placeholder="dba_admin,compliance_officer">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="saveRule()">Save Rule</button>
    </div>
  </div>

  <div class="panel table-panel">
    <div class="panel-header">
      <span>Masking Rules</span>
      <span id="rule-count" style="font-size:12px;color:var(--text-secondary)"></span>
    </div>
    <div class="panel-body" style="padding:0">
      <table>
        <thead>
          <tr>
            <th>Server</th>
            <th>Table</th>
            <th>Column</th>
            <th>PII Type</th>
            <th>Mask Type</th>
            <th>Regulation</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rule-table-body">
          <tr><td colspan="8" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let rules = [];

function maskBadge(m){
  const cls={REDACT:'badge-redact',PARTIAL:'badge-partial',HASH:'badge-hash',TOKENIZE:'badge-tokenize'};
  return `<span class="badge ${cls[m]||''}">${m}</span>`;
}

async function load(){
  const pii    = document.getElementById('filter-pii').value;
  const mask   = document.getElementById('filter-mask').value;
  const active = document.getElementById('filter-active').value;
  const server = document.getElementById('filter-server').value;
  const params = new URLSearchParams();
  if(pii)    params.set('pii_type', pii);
  if(mask)   params.set('mask_type', mask);
  if(active !== '') params.set('is_active', active);
  if(server) params.set('server_name', server);

  const res  = await fetch('/api/masking-rules?' + params);
  const data = await res.json();
  rules = data.rules || [];

  const byMask = {REDACT:0,PARTIAL:0,HASH:0,TOKENIZE:0};
  let activeCount = 0;
  rules.forEach(r => { if(byMask[r.mask_type]!==undefined) byMask[r.mask_type]++; if(r.is_active) activeCount++; });

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-panel"><div class="stat-value" style="color:var(--red-text)">${byMask.REDACT}</div><div class="stat-label">REDACT</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--yellow)">${byMask.PARTIAL}</div><div class="stat-label">PARTIAL</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--blue)">${byMask.HASH}</div><div class="stat-label">HASH</div></div>
    <div class="stat-panel"><div class="stat-value" style="color:var(--purple)">${byMask.TOKENIZE}</div><div class="stat-label">TOKENIZE</div></div>
    <div class="stat-panel"><div class="stat-value">${activeCount}</div><div class="stat-label">Active</div></div>
  `;
  document.getElementById('rule-count').textContent = `${rules.length} rules`;

  const tbody = document.getElementById('rule-table-body');
  if(!rules.length){
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No masking rules found</td></tr>';
    return;
  }
  tbody.innerHTML = rules.map(r => `
    <tr>
      <td style="font-size:12px">${r.server_name}</td>
      <td style="font-size:12px">${r.table_name}</td>
      <td style="font-size:12px;font-family:monospace">${r.column_name}</td>
      <td style="font-size:12px;font-weight:500">${r.pii_type}</td>
      <td>${maskBadge(r.mask_type)}</td>
      <td style="font-size:11px">${r.regulation||''}</td>
      <td>${r.is_active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
      <td>
        <div class="actions-cell">
          <button class="btn btn-sm btn-edit" onclick="editRule(${r.rule_id})">Edit</button>
          <button class="btn btn-sm ${r.is_active ? 'btn-disable' : 'btn-enable'}" onclick="toggleRule(${r.rule_id},${!r.is_active})">${r.is_active ? 'Disable' : 'Enable'}</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function newRule(){
  document.getElementById('form-title').textContent = 'New Rule';
  document.getElementById('f-rule-id').value = '';
  ['f-server','f-table','f-column','f-roles'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-pii').value = 'GENERIC';
  document.getElementById('f-mask').value = 'HASH';
  document.getElementById('f-regulation').value = '';
}

function editRule(id){
  const r = rules.find(x => x.rule_id === id);
  if(!r) return;
  document.getElementById('form-title').textContent = 'Edit Rule';
  document.getElementById('f-rule-id').value = id;
  document.getElementById('f-server').value = r.server_name || '';
  document.getElementById('f-table').value  = r.table_name || '';
  document.getElementById('f-column').value = r.column_name || '';
  document.getElementById('f-pii').value    = r.pii_type || 'GENERIC';
  document.getElementById('f-mask').value   = r.mask_type || 'HASH';
  document.getElementById('f-regulation').value = r.regulation || '';
  document.getElementById('f-roles').value  = (r.allowed_roles||[]).join(',');
}

function cancelForm(){ newRule(); }

async function saveRule(){
  const id = document.getElementById('f-rule-id').value;
  const body = {
    server_name:   document.getElementById('f-server').value.trim(),
    table_name:    document.getElementById('f-table').value.trim(),
    column_name:   document.getElementById('f-column').value.trim(),
    pii_type:      document.getElementById('f-pii').value,
    mask_type:     document.getElementById('f-mask').value,
    regulation:    document.getElementById('f-regulation').value || null,
    allowed_roles: document.getElementById('f-roles').value.split(',').map(s=>s.trim()).filter(Boolean),
  };
  if(!body.server_name || !body.table_name || !body.column_name){
    showToast('Server, table and column are required', true); return;
  }
  const url    = id ? `/api/masking-rules/${id}` : '/api/masking-rules';
  const method = id ? 'PUT' : 'POST';
  const res    = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data   = await res.json();
  if(!res.ok){ showToast(data.detail||data.message||'Error', true); return; }
  showToast(id ? 'Rule updated' : 'Rule created');
  newRule();
  load();
}

async function toggleRule(id, active){
  const res  = await fetch(`/api/masking-rules/${id}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({is_active: active}),
  });
  const data = await res.json();
  if(!res.ok){ showToast(data.detail||'Error', true); return; }
  showToast(active ? 'Rule enabled' : 'Rule disabled');
  load();
}

async function syncRules(){
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  const res  = await fetch('/api/masking-rules/sync', {method:'POST'});
  const data = await res.json();
  btn.disabled = false;
  btn.textContent = '⟳ Sync from Discovery';
  if(!res.ok){ showToast(data.detail||'Error', true); return; }
  showToast(`Sync complete: ${data.message}`);
  load();
}

function showToast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err?' err':'');
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
}

load();
</script>
</body>
</html>
